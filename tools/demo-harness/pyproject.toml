[project]
name = "utrace-demo-harness"
version = "0.1.0"
description = "Prepares, drives, observes, and verifies the Shopalytics demo in docs/SCENARIO.md."
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "stripe>=11",
  "structlog>=24.4",
  "utrace-contracts",
]

[project.scripts]
demo = "demo_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_harness"]

[tool.uv.sources]
utrace-contracts = { path = "../../packages/utrace-contracts/python", editable = true }

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["demo_harness", "tests"]
