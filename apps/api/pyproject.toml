[project]
name = "utrace-api"
version = "0.1.0"
description = "uTrace control plane: FastAPI API, durable workers, connectors, telemetry ingestion."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "httpx2>=2.13",
  "structlog>=24.4",
  "openai[realtime]>=3.16.2",
  "stripe>=11",
  "websockets>=13",
  "PyJWT[crypto]>=2.9",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-proto>=1.27",
  "protobuf>=5",
  "discord.py>=2.7",
  "typesafe-sdk>=0.7",
  "utrace-contracts",
  "vercel>=0.11.4",
]

[project.scripts]
utrace-worker = "app.execution.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "types-protobuf>=5.28",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "aiortc>=1.15.0",
]

[tool.uv.sources]
utrace-contracts = { path = "../../packages/utrace-contracts/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
strict = true
python_version = "3.13"
