<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 746 1105" width="746" height="1105" style="max-width:100%;height:auto" role="img" aria-label="Candidate publication · fast checks and readiness before the answer, full checks before delivery"><title>Candidate publication · fast checks and readiness before the answer, full checks before delivery</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="746" height="1105" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 746 1105" width="746" height="1105" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_result_spare_0"><path d="M461.02,111L461.02,119.97C461.02,122.85 183.14,128.62 183.14,131.5L183.14,177"/><path class="pele-marker" d="M183.14,184L179.78,176L186.5,176Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_spare_fast_0"><path d="M183.14,271L183.14,316.5C183.14,324.19 227.76,324.19 227.76,331.88L227.76,337"/><path class="pele-marker" d="M227.76,344L224.4,336L231.12,336Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_fast_readiness_0"><path d="M312.48,431L312.48,497"/><path class="pele-marker" d="M312.48,504L309.12,496L315.84,496Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_readiness_route_0"><path d="M213.28,591C213.28,601.25 153.7,601.25 153.7,611.5L153.7,657"/><path class="pele-marker" d="M153.7,664L150.34,656L157.06,656Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_route_full_0"><path d="M153.7,751L153.7,796.5C153.7,800.4 396.34,807.98 396.34,811.88L396.34,817"/><path class="pele-marker" d="M396.34,824L392.98,816L399.7,816Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_full_deliverable_0"><path d="M441.71,911L441.71,977"/><path class="pele-marker" d="M441.71,984L438.35,976L445.07,976Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_1"><path d="M397.2,344L397.2,331C397.2,301 517.06,301 517.06,271L517.06,118" stroke-dasharray="3 4"/><path class="pele-marker" d="M517.06,111L520.42,119L513.7,119Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_2"><path d="M487.08,824L487.08,811C487.08,781 650.38,781 650.38,751L650.38,184C650.38,154 573.1,154 573.1,124L573.1,118" stroke-dasharray="3 4"/><path class="pele-marker" d="M573.1,111L576.46,119L569.74,119Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_1"><path d="M411.67,591C411.67,601.25 471.26,601.25 471.26,611.5L471.26,676.5"/><path class="pele-marker" d="M471.26,683.5L467.9,675.5L474.62,675.5Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_result_spare_0"><rect x="135.18" y="133.5" width="95.92" height="21" rx="3" fill="var(--_bg)"/><text x="183.14" y="148.9" text-anchor="middle">install the files</text></g><g class="pele-edge-label" data-id="L_spare_fast_0"><rect x="128.95" y="293.5" width="108.38" height="21" rx="3" fill="var(--_bg)"/><text x="183.14" y="308.9" text-anchor="middle">build and restart</text></g><g class="pele-edge-label" data-id="L_fast_readiness_0"><rect x="293.69" y="453.5" width="37.57" height="21" rx="3" fill="var(--_bg)"/><text x="312.48" y="468.9" text-anchor="middle">pass</text></g><g class="pele-edge-label" data-id="L_readiness_route_0"><rect x="93.12" y="613.5" width="121.16" height="21" rx="3" fill="var(--_bg)"/><text x="153.7" y="628.9" text-anchor="middle">approved · switch</text></g><g class="pele-edge-label" data-id="L_route_full_0"><rect x="58.27" y="773.5" width="190.85" height="21" rx="3" fill="var(--_bg)"/><text x="153.7" y="788.9" text-anchor="middle">while the participant validates</text></g><g class="pele-edge-label" da