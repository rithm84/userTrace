="108.38" height="21" rx="3" fill="var(--_bg)"/><text x="636.04" y="470.9" text-anchor="middle">pointing tool call</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect reasoning" data-id="text" transform="translate(175.36,107.5)"><rect x="-131.36" y="-33" width="262.72" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Text model</tspan><tspan x="0" y="16.1">Words with inline gesture marks</tspan></text></g><g class="pele-node pele-shape-rect runtime" data-id="pipe" transform="translate(600.19,107.5)"><rect x="-142.06" y="-43.5" width="284.13" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Speech stage</tspan><tspan x="0" y="5.6">A speech engine speaks the words</tspan><tspan x="0" y="26.6">Each mark kept with its word</tspan></text></g><g class="pele-node pele-shape-stadium observation" data-id="circle_a" transform="translate(1017.51,107.5)"><rect x="-46.44" y="-24" width="92.88" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Circle</text></g><g class="pele-node pele-shape-rect reasoning" data-id="live" transform="translate(256.73,292)"><rect x="-82.47" y="-33" width="164.94" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">GPT-Live</tspan><tspan x="0" y="16.1">Hears and speaks</tspan></text></g><g class="pele-node pele-shape-rect reasoning" data-id="jev" transform="translate(616.84,292)"><rect x="-77.58" y="-24" width="155.17" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Jev clause judge</text></g><g class="pele-node pele-shape-stadium observation" data-id="circle_b" transform="translate(887.25,292)"><rect x="-46.44" y="-24" width="92.88" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Circle</text></g><g class="pele-node pele-shape-rect reasoning" data-id="s2s" transform="translate(427.34,466)"><rect x="-132.01" y="-33" width="264.02" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Speech-to-speech model</tspan><tspan x="0" y="16.1">gpt-realtime-2 · Gemini 3.8 Live</tspan></text></g><g class="pele-node pele-shape-stadium observation" data-id="circle_c" transform="translate(766.17,466)"><rect x="-46.44" y="-24" width="92.88" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Circle</text></g></g></svg></svg>
