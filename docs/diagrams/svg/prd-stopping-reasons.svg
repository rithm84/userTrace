<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1006 860" width="1006" height="860" style="max-width:100%;height:auto" role="img" aria-label="Stopping during live work · each reason has its own outcome"><title>Stopping during live work · each reason has its own outcome</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1006" height="860" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1006 860" width="1006" height="860" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="reasons"><rect x="24" y="24" width="364.53" height="812" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="103.8" y="49.6" text-anchor="middle">Why work stopped</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="async_1"><path d="M348.53,88L690.3,88C729.98,88 754.3,129.32 754.3,196.75C754.3,264.18 760.29,305.5 770.05,305.5L775.3,305.5" stroke-dasharray="3 4"/><path class="pele-marker" d="M782.3,305.5L774.3,308.86L774.3,302.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_2"><path d="M348.53,176L690.3,176C722.54,176 742.3,202.6 742.3,246C742.3,289.4 752.56,316 769.3,316L775.3,316" stroke-dasharray="3 4"/><path class="pele-marker" d="M782.3,316L774.3,319.36L774.3,312.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_3"><path d="M347.16,344C357.84,344 357.84,312 368.53,312L690.3,312C729.8,312 729.8,337 769.3,337L775.3,337" stroke-dasharray="3 4"/><path class="pele-marker" d="M782.3,337L774.3,340.36L774.3,333.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_1"><path d="M347.16,360C357.84,360 357.84,388 368.53,388L690.3,388C722.54,388 742.3,411.37 742.3,449.5C742.3,487.63 752.56,511 769.3,511L775.3,511"/><path class="pele-marker" d="M782.3,511L774.3,514.36L774.3,507.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_4"><path d="M348.53,432C358.53,432 358.53,404 368.53,404L388.53,404C398.78,404 398.78,429 409.03,429L690.3,429C715.1,429 730.3,413.52 730.3,388.25C730.3,362.99 745.12,347.5 769.3,347.5L775.3,347.5" stroke-dasharray="3 4"/><path class="pele-marker" d="M782.3,347.5L774.3,350.86L774.3,344.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_2"><path d="M348.53,448C358.53,448 358.53,480 368.53,480L388.53,480C398.78,480 398.78,470 409.03,470L690.3,470C729.8,470 729.8,511 769.3,511L775.3,511"/><path class="pele-marker" d="M782.3,511L774.3,514.36L774.3,507.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_3"><path d="M348.53,608C358.53,608 358.53,576 368.53,576L388.53,576C398.78,576 398.78,552 409.03,552L690.3,552C729.8,552 729.8,511 769.3,511L775.3,511"/><path class="pele-marker" d="M782.3,511L774.3,514.36L774.3,507.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_4"><path d="M348.53,624C358.53,624 358.53,656 368.53,656L388.53,656C398.78,656 398.78,593 409.03,593L690.3,593C715.1,593 730.3,605.83 730.3,626.75C730.3,647.67 745.65,660.5 770.68,660.5L776.68,660.5"/><path class="pele-marker" d="M783.68,660.5L775.68,663.86L775.68,657.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_5"><path d="M348.53,264L690.3,264C715.1,264 730.3,275.88 730.3,295.25C730.3,314.63 745.12,326.5 769.3,326.5L775.3,326.5" stroke-dasharray="3 4"/><path class="pele-marker" d="M782.3,326.5L774.3,329.86L774.3,323.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_5"><path d="M348.53,528L388.53,528C398.78,528 398.78,511 409.03,511L775.3,511"/><path class="pele-marker" d="M782.3,511L774.3,514.36L774.3,507.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_6"><path d="M348.53,704L388.53,704C398.78,704 398.78,668.5 409.03,668.5L690.3,668.5C722.54,668.5 742.3,638.58 742.3,589.75C742.3,540.92 752.56,511 769.3,511L775.3,511"/><path class="pele-marker" d="M782.3,511L774.3,514.36L774.3,507.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_7"><path d="M348.53,792L690.3,792C730.49,792 730.49,676.5 770.68,676.5L776.68,676.5"/><path class="pele-marker" d="M783.68,676.5L775.68,679.86L775.68,673.14Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="async_1"><rect x="425.45" y="77.5" width="248.44" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="92.9" text-anchor="middle">resume once everything is ready again</text></g><g class="pele-edge-label" data-id="async_2"><rect x="458.13" y="165.5" width="183.07" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="180.9" text-anchor="middle">reconnect within the window</text></g><g class="pele-edge-label" data-id="async_3"><rect x="450.35" y="301.5" width="198.62" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="316.9" text-anchor="middle">return within the return window</text></g><g class="pele-edge-label" data-id="blocked_1"><rect x="477.59" y="377.5" width="144.15" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="392.9" text-anchor="middle">return window expires</text></g><g class="pele-edge-label" data-id="async_4"><rect x="458.12" y="418.5" width="183.08" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="433.9" text-anchor="middle">bounded recovery succeeds</text></g><g class="pele-edge-label" data-id="blocked_2"><rect x="439.85" y="459.5" width="219.62" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="474.9" text-anchor="middle">unrecoverable or recovery expires</text></g><g class="pele-edge-label" data-id="blocked_3"><rect x="491.98" y="541.5" width="115.38" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="556.9" text-anchor="middle">after participation</text></g><g class="pele-edge-label" data-id="blocked_4"><rect x="486.14" y="582.5" width="127.06" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="597.9" text-anchor="middle">before participation</text></g><g class="pele-edge-label" data-id="async_5"><rect x="469.42" y="253.5" width="160.5" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="268.9" text-anchor="middle">continues as async work</text></g><g class="pele-edge-label" data-id="blocked_5"><rect x="512.21" y="500.5" width="74.92" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="515.9" text-anchor="middle">checkpoint</text></g><g class="pele-edge-label" data-id="blocked_6"><rect x="411.03" y="658" width="277.28" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="673.4" text-anchor="middle">iteration budget spent or no change wanted</text></g><g class="pele-edge-label" data-id="blocked_7"><rect x="482.63" y="781.5" width="134.07" height="21" rx="3" fill="var(--_bg)"/><text x="549.67" y="796.9" text-anchor="middle">revoke and clean up</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium people" data-id="pause" transform="translate(273.62,88)"><rect x="-74.91" y="-24" width="149.82" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Pause control</text></g><g class="pele-node pele-shape-stadium people" data-id="loss" transform="translate(196.26,176)"><rect x="-152.26" y="-24" width="304.53" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Temporary connection or voice loss</text></g><g class="pele-node pele-shape-stadium people" data-id="away" transform="translate(237.61,352)"><rect x="-110.92" y="-24" width="221.84" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Finish later or departure</text></g><g class="pele-node pele-shape-rect runtime" data-id="blocker" transform="translate(268.29,440)"><rect x="-80.24" y="-24" width="160.48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Technical blocker</text></g><g class="pele-node pele-shape-stadium people" data-id="cancel" transform="translate(278.51,792)"><rect x="-70.02" y="-24" width="140.03" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Cancellation</text></g><g class="pele-node pele-shape-rect client" data-id="client_stop" transform="translate(292.74,616)"><rect x="-55.79" y="-24" width="111.58" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Client stop</text></g><g class="pele-node pele-shape-rect gate" data-id="no_fit" transform="translate(219.38,264)"><rect x="-129.15" y="-24" width="258.3" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Live work outgrows the session</text></g><g class="pele-node pele-shape-rect gate" data-id="spent" transform="translate(238.04,528)"><rect x="-110.49" y="-24" width="220.98" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Time or cost budget spent</text></g><g class="pele-node pele-shape-hex gate" data-id="unsuccessful" transform="translate(234.94,704)"><polygon points="-101.58,-24 101.58,-24 113.58,0 101.58,24 -101.58,24 -113.58,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Unsuccessful validation</text></g><g class="pele-node pele-shape-rect async" data-id="continues" transform="translate(881.67,326.5)"><rect x="-99.37" y="-33" width="198.74" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Same case continues</tspan><tspan x="0" y="16.1">Budgets never reset</tspan></text></g><g class="pele-node pele-shape-doc external" data-id="blocker_case" transform="translate(867,511)"><path d="M-84.7,-38H84.7V28q-42.35,-12 -84.7,0t-84.7,0Z" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.9" font-weight="var(--_w)">Blocker Case File</tspan><tspan x="0" y="11.1">No PR</tspan></text></g><g class="pele-node pele-shape-stadium external" data-id="no_output" transform="translate(877.21,668.5)"><rect x="-94.9" y="-24" width="189.81" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">No Case File or PR</text></g></g></svg></svg>
