<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1366 458" width="1366" height="458" style="max-width:100%;height:auto" role="img" aria-label="Operational observability · kept apart from product evidence"><title>Operational observability · kept apart from product evidence</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1366" height="458" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1366 458" width="1366" height="458" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="cp_record"><rect x="873.48" y="163" width="468.17" height="271" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="944.84" y="188.6" text-anchor="middle">uTrace backend</text></g><g class="pele-cluster" data-id="preview_path"><rect x="330.86" y="24" width="263.62" height="247" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="391.1" y="49.6" text-anchor="middle">Preview path</text></g><g class="pele-cluster" data-id="web_ops"><rect x="24" y="33" width="258.86" height="229" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="118.66" y="58.6" text-anchor="middle">Web surfaces · Vercel</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_web_vo_0"><path d="M153.43,121L153.43,187"/><path class="pele-marker" d="M153.43,194L150.07,186L156.79,186Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_door_sdk_0"><path d="M462.67,130L462.67,196"/><path class="pele-marker" d="M462.67,203L459.31,195L466.03,195Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cp_logs_0"><path d="M1074.11,251C1074.11,261.25 972.43,261.25 972.43,271.5L972.43,317"/><path class="pele-marker" d="M972.43,324L969.07,316L975.79,316Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cp_pg_0"><path d="M1101.26,251C1101.26,261.25 1202.94,261.25 1202.94,271.5L1202.94,317"/><path class="pele-marker" d="M1202.94,324L1199.58,316L1206.3,316Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_sdk_cp_0"><path d="M574.48,227L1015.11,227"/><path class="pele-marker" d="M1022.11,227L1014.11,230.36L1014.11,223.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_web_vo_0"><rect x="46" y="143.5" width="214.86" height="21" rx="3" fill="var(--_bg)"/><text x="153.43" y="158.9" text-anchor="middle">traces · page views · Web Vitals</text></g><g class="pele-edge-label" data-id="L_door_sdk_0"><rect x="359.85" y="152.5" width="205.65" height="21" rx="3" fill="var(--_bg)"/><text x="462.67" y="167.9" text-anchor="middle">browser traceparent, untouched</text></g><g class="pele-edge-label" data-id="L_cp_logs_0"><rect x="895.48" y="273.5" width="153.89" height="21" rx="3" fill="var(--_bg)"/><text x="972.43" y="288.9" text-anchor="middle">fixed messages + fields</text></g><g class="pele-edge-label" data-id="L_cp_pg_0"><rect x="1176.39" y="273.5" width="53.11" height="21" rx="3" fill="var(--_bg)"/><text x="1202.94" y="288.9" text-anchor="middle">commit</text></g><g class="pele-edge-label" data-id="L_sdk_cp_0"><rect x="616.98" y="216.5" width="227" height="21" rx="3" fill="var(--_bg)"/><text x="730.48" y="231.9" text-anchor="middle">product spans as evidence · OTLP</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect runtime" data-id="web" transform="translate(153.43,97)"><rect x="-57.57" y="-24" width="115.14" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">utrace-web</text></g><g class="pele-node pele-shape-rect external" data-id="vo" transform="translate(153.43,218)"><rect x="-89.13" y="-24" width="178.26" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Vercel Observability</text></g><g class="pele-node pele-shape-rect runtime" data-id="door" transform="translate(462.67,97)"><rect x="-88.68" y="-33" width="177.36" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Preview front door</tspan><tspan x="0" y="16.1">No instrumentation</tspan></text></g><g class="pele-node pele-shape-rect observation" data-id="sdk" transform="translate(462.67,227)"><rect x="-111.81" y="-24" width="223.62" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Server SDK in the preview</text></g><g class="pele-node pele-shape-rect runtime" data-id="cp" transform="translate(1087.69,227)"><rect x="-65.58" y="-24" width="131.15" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Control plane</text></g><g class="pele-node pele-shape-cyl runtime" data-id="logs" transform="translate(972.43,358.26)"><path d="M-71.8,-24A71.8,10.26 0 0 1 71.8,-24V24A71.8,10.26 0 0 1 -71.8,24Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-71.8,-24A71.8,10.26 0 0 0 71.8,-24" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="10.73" text-anchor="middle">Structured logs</text></g><g class="pele-node pele-shape-cyl outcome" data-id="pg" transform="translate(1202.94,369)"><path d="M-118.71,-33A118.71,12 0 0 1 118.71,-33V33A118.71,12 0 0 1 -118.71,33Z" fill="var(--_s)" stroke="var(