<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 880 751" width="880" height="751" style="max-width:100%;height:auto" role="img" aria-label="Previews and workspaces · where the user works and where code changes"><title>Previews and workspaces · where the user works and where code changes</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="880" height="751" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 880 751" width="880" height="751" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="workspaces"><rect x="520.39" y="145" width="334.78" height="208" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="574.4" y="170.6" text-anchor="middle">Workspace</text></g><g class="pele-cluster" data-id="previews"><rect x="24" y="426" width="672.27" height="187" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="70.45" y="451.6" text-anchor="middle">Previews</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_user_link_0"><path d="M306.53,72L306.53,209"/><path class="pele-marker" d="M306.53,216L303.17,208L309.89,208Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_link_base_0"><path d="M194.96,282L194.96,479"/><path class="pele-marker" d="M194.96,486L191.6,478L198.32,478Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_gate_workspace_0"><path d="M687.78,72L687.78,198"/><path class="pele-marker" d="M687.78,205L684.42,197L691.14,197Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_workspace_next_0"><path d="M679.78,313L679.78,353C679.78,363.25 539.1,363.25 539.1,373.5L539.1,489.5"/><path class="pele-marker" d="M539.1,496.5L535.74,488.5L542.46,488.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_1"><path d="M367.03,282L367.03,466C367.03,474.81 437.92,474.81 437.92,483.63L437.92,489.5" stroke-dasharray="3 4"/><path class="pele-marker" d="M437.92,496.5L434.56,488.5L441.28,488.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_base_ended_0"><path d="M194.96,573L194.96,613C194.96,628.4 513.22,632.6 513.22,648L513.22,654"/><path class="pele-marker" d="M513.22,661L509.86,653L516.58,653Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_next_ended_0"><path d="M531.1,562.5L531.1,654"/><path class="pele-marker" d="M531.1,661L527.74,653L534.46,653Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_workspace_ended_0"><path d="M695.78,313L695.78,353C695.78,389.5 724.27,389.5 724.27,426L724.27,613C724.27,630.5 669.17,630.5 669.17,648L669.17,654"/><path class="pele-marker" d="M669.17,661L665.81,653L672.53,653Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_link_base_0"><rect x="171.89" y="375.5" width="46.14" height="21" rx="3" fill="var(--_bg)"/><text x="194.96" y="390.9" text-anchor="middle">opens</text></g><g class="pele-edge-label" data-id="L_gate_workspace_0"><rect x="612.58" y="94.5" width="150.41" height="21" rx="3" fill="var(--_bg)"/><text x="687.78" y="109.9" text-anchor="middle">authorizes one attempt</text></g><g class="pele-edge-label" data-id="L_workspace_next_0"><rect x="484.12" y="375.5" width="109.95" height="21" rx="3" fill="var(--_bg)"/><text x="539.1" y="390.9" text-anchor="middle">checked change</text></g><g class="pele-edge-label" data-id="async_1"><rect x="289.11" y="375.5" width="155.84" height="21" rx="3" fill="var(--_bg)"/><text x="367.03" y="390.9" text-anchor="middle">switches to it all at once</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium people" data-id="user" transform="translate(306.53,48)"><rect x="-82.46" y="-24" width="164.93" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Originating user</text></g><g class="pele-node pele-shape-rect runtime" data-id="link" transform="translate(306.53,249)"><rect x="-123.82" y="-33" width="247.63" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Preview link</tspan><tspan x="0" y="16.1">The same address all session</tspan></text></g><g class="pele-node pele-shape-hex gate" data-id="gate" transform="translate(687.78,48)"><polygon points="-92.26,-24 92.26,-24 104.26,0 92.26,24 -92.26,24 -104.26,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Implementation Gate</text></g><g class="pele-node pele-shape-rect observation" data-id="base" transform="translate(194.96,529.5)"><rect x="-150.96" y="-43.5" width="301.92" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Current preview</tspan><tspan x="0" y="5.6">A private, running copy of the product</tspan><tspan x="0" y="26.6">Realistic data, signed in as the user</tspan></text></g><g class="pele-node pele-shape-rect observation" data-id="next" transform="translate(531.1,529.5)"><rect x="-145.18" y="-33" width="290.35" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">New version's preview</tspan><tspan x="0" y="16.1">A separate copy with the same data</tspan></text></g><g class="pele-node pele-shape-rect runtime" data-id="workspace" transform="translate(687.78,259)"><rect x="-147.39" y="-54" width="294.78" height="108" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9" font-weight="var(--_w)">Coding workspace</tspan><tspan x="0" y="-4.9">Code authority, never customer data</tspan><tspan x="0" y="16.1">Speculative drafts before approval</tspan><tspan x="0" y="37.1">Builds the approved change</tspan></text></g><g class="pele-node pele-shape-stadium neutral" data-id="ended" transform="translate(591.2,694)"><rect x="-150.97" y="-33" width="301.94" height="66" rx="33" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Deleted when no longer needed</tspan><tspan x="0" y="16.1">Never reset and reused</tspan></text></g></g></svg></svg>
