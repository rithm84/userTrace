<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 946 869" width="946" height="869" style="max-width:100%;height:auto" role="img" aria-label="Preview runtimes and implementation workspaces · separate resources"><title>Preview runtimes and implementation workspaces · separate resources</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="946" height="869" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 946 869" width="946" height="869" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="code_authority"><rect x="479.99" y="145" width="441.02" height="187" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="product_access"><rect x="24" y="405" width="684.85" height="326" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_user_door_0"><path d="M346.49,72L346.49,207.5"/><path class="pele-marker" d="M346.49,214.5L343.13,206.5L349.85,206.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pool_base_0"><path d="M292.4,531L292.4,597"/><path class="pele-marker" d="M292.4,604L289.04,596L295.76,596Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_door_base_0"><path d="M315.57,262.5C315.57,307.5 85.01,307.5 85.01,352.5L85.01,597"/><path class="pele-marker" d="M85.01,604L81.65,596L88.37,596Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_gate_workspace_0"><path d="M700.51,72L700.51,198"/><path class="pele-marker" d="M700.51,205L697.15,197L703.87,197Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_workspace_candidate_0"><path d="M692.51,292L692.51,332C692.51,342.25 563.25,342.25 563.25,352.5L563.25,597"/><path class="pele-marker" d="M563.25,604L559.89,596L566.61,596Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_1"><path d="M354.49,262.5L354.49,377.5C354.49,391.25 499.79,391.25 499.79,405L499.79,597" stroke-dasharray="3 4"/><path class="pele-marker" d="M499.79,604L496.43,596L503.15,596Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_base_ended_0"><path d="M188.7,691L188.7,731C188.7,748.09 475.41,748.91 475.41,766L475.41,772"/><path class="pele-marker" d="M475.41,779L472.05,771L478.77,771Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_candidate_ended_0"><path d="M555.25,691L555.25,772"/><path class="pele-marker" d="M555.25,779L551.89,771L558.61,771Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_workspace_ended_0"><path d="M708.51,292L708.51,332C708.51,368.5 736.85,368.5 736.85,405L736.85,731C736.85,748.5 637.63,748.5 637.63,766L637.63,772"/><path class="pele-marker" d="M637.63,779L634.27,771L640.99,771Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-cluster-titles"><g class="pele-cluster-title" data-id="code_authority"><text fill="none" stroke="color-mix(in srgb,var(--_a) 50%,var(--_bg))" stroke-width="5" stroke-linejoin="round" x="700.51" y="170.6" text-anchor="middle">Implementation workspace · code authority, no client data</text><text class="pele-cluster-label" fill="var(--_m)" x="700.51" y="170.6" text-anchor="middle">Implementation workspace · code authority, no client data</text></g><g class="pele-cluster-title" data-id="product_access"><text fill="none" stroke="color-mix(in srgb,var(--_a) 50%,var(--_bg))" stroke-width="5" stroke-linejoin="round" x="224.05" y="430.6" text-anchor="middle">Preview runtime · product access, no code authority</text><text class="pele-cluster-label" fill="var(--_m)" x="224.05" y="430.6" text-anchor="middle">Preview runtime · product access, no code authority</text></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_user_door_0"><rect x="267.4" y="94.5" width="158.18" height="21" rx="3" fill="var(--_bg)"/><text x="346.49" y="109.9" text-anchor="middle">one stable uTrace origin</text></g><g class="pele-edge-label" data-id="L_pool_base_0"><rect x="193.48" y="553.5" width="197.84" height="21" rx="3" fill="var(--_bg)"/><text x="292.4" y="568.9" text-anchor="middle">claim for the Interview Session</text></g><g class="pele-edge-label" data-id="L_door_base_0"><rect x="53.77" y="354.5" width="62.47" height="21" rx="3" fill="var(--_bg)"/><text x="85.01" y="369.9" text-anchor="middle">routes to</text></g><g class="pele-edge-label" data-id="L_gate_workspace_0"><rect x="625.3" y="94.5" width="150.41" height="21" rx="3" fill="var(--_bg)"/><text x="700.51" y="109.9" text-anchor="middle">authorizes one attempt</text></g><g class="pele-edge-label" data-id="L_workspace_candidate_0"><rect x="494.66" y="354.5" width="137.18" height="21" rx="3" fill="var(--_bg)"/><text x="563.25" y="369.9" text-anchor="middle">fast-checked change</text></g><g class="pele-edge-label" data-id="async_1"><rect x="252.06" y="354.5" width="204.85" height="21" rx="3" fill="var(--_bg)"/><text x="354.49" y="369.9" text-anchor="middle">switches to it whole when ready</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium people" data-id="user" transform="translate(346.49,48)"><rect x="-82.46" y="-24" width="164.93" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Originating user</text></g><g class="pele-node pele-shape-rect runtime" data-id="door" transform="translate(346.49,238.5)"><rect x="-82.91" y="-24" width="165.82" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Preview front door</text></g><g class=