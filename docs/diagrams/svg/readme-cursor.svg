<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1258 650" width="1258" height="650" style="max-width:100%;height:auto" role="img" aria-label="The agent cursor · a mark in the reply, circled as the word plays"><title>The agent cursor · a mark in the reply, circled as the word plays</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1258" height="650" rx="8"/><svg x="0" y="0" class="pele pele-sequence" viewBox="0 0 1258 650" width="1258" height="650" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="sequence"><g transform="translate(101.56,24)"><g class="pele-lifelines" fill="none" stroke="var(--_b)"><path class="pele-lifeline" data-id="sol" d="M0,62V540"/><path class="pele-lifeline" data-id="tap" d="M241.23,62V540"/><path class="pele-lifeline" data-id="sdk" d="M508.3,62V540"/><path class="pele-lifeline" data-id="ext" d="M731.78,62V540"/><path class="pele-lifeline" data-id="customer" d="M1093.02,62V540"/></g><g class="pele-frames" font-size="14" stroke="var(--_b)"><g class="pele-frame pele-frame-par"><rect x="221.23" y="242" width="891.79" height="195" fill="none" style="rx:var(--_r)"/><path d="M221.23,314H1113.02" stroke-dasharray="4 4"/><rect x="221.23" y="242" width="32.67" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="237.56" y="256.2" text-anchor="middle" font-size="12" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">par</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="335.43" y="257.4" text-anchor="middle">[as the next word plays]</text></g><g class="pele-frame pele-frame-opt"><rect x="221.23" y="449" width="225.72" height="71" fill="none" style="rx:var(--_r)"/><rect x="221.23" y="449" width="32.66" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="237.56" y="463.2" text-anchor="middle" font-size="12" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">opt</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="337.36" y="464.4" text-anchor="middle">[the customer interrupts]</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i1"><path d="M500.3,120H7"/><path class="pele-marker" d="M0,120L8,116.64L8,123.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="500.3" y="112" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="508.3" y="124.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">1</text></g></g><g class="pele-edge pele-message" data-id="i2"><path d="M8,172H234.23"/><path class="pele-marker" d="M241.23,172L233.23,175.36L233.23,168.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="-8" y="164" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="0" y="176.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">2</text></g></g><g class="pele-edge pele-message" data-id="i5"><path d="M249.23,302H1086.02"/><path class="pele-marker" d="M1093.02,302L1085.02,305.36L1085.02,298.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="233.23" y="294" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="241.23" y="306.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">3</text></g></g><g class="pele-edge pele-message" data-id="i7"><path d="M249.23,351H501.3"/><path class="pele-marker" d="M508.3,351L500.3,354.36L500.3,347.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="233.23" y="343" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="241.23" y="355.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">4</text></g></g><g class="pele-edge pele-message" data-id="i8"><path d="M516.3,388H724.78"/><path class="pele-marker" d="M731.78,388L723.78,391.36L723.78,384.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="500.3" y="380" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="508.3" y="392.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">5</text></g></g><g class="pele-edge pele-message" data-id="i9"><path d="M739.78,425H1086.02"/><path class="pele-marker" d="M1093.02,425L1085.02,428.36L1085.02,421.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="723.78" y="417" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="731.78" y="429.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">6</text></g></g><g class="pele-edge pele-message" data-id="i12"><path d="M249.23,486H271.23A6,6 0 0 1 277.23,492V502A6,6 0 0 1 271.23,508H248.23"/><path class="pele-marker" d="M241.23,508L249.23,504.64L249.23,511.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="233.23" y="478" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="241.23" y="490.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">7</text></g></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i1"><rect x="141.34" y="82" width="217.62" height="32" rx="3" fill="var(--_bg)" stroke="none"/><text text-anchor="middle" xml:space="preserve"><tspan x="250.15" y="93.9">live registry: controls, chart points,</tspan><tspan x="250.15" y="111.9">rows, list items as T1, T2, …</tspan></text></g><g class="pele-edge-label" data-id="i2"><text text-anchor="middle" xml:space="preserve"><tspan x="124.61" y="145.9">…the &lt;c id=&quot;T3&quot;/&gt;Export button</tspan><tspan x="124.61" y="163.9">at the top right…</tspan></text></g><g class="pele-edge-label" data-id="i5"><rect x="595.85" y="279" width="150.55" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="671.12" y="292.4" text-anchor="middle">the word &quot;Export&quot; plays</text></g><g class="pele-edge-label" data-id="i7"><text x="378.76" y="341.4" text-anchor="middle">resolve T3 at its registered revision</text></g><g class="pele-edge-label" data-id="i8"><text x="624.04" y="378.4" text-anchor="middle">circle T3 at its live geometry</text></g><g class="pele-edge-label" data-id="i9"><text x="916.4" y="415.4" text-anchor="middle">the cursor glides over and circles the exact control</text></g><g class="pele-edge-label" data-id="i12"><text x="347.09" y="501.9" text-anchor="middle">drop pending marks</text></g></g><g class="pele-notes" font-size="14" fill="var(--_a)" stroke="var(--_b)"><g class="pele-note" data-id="i3"><rect x="148.75" y="182" width="184.95" height="48" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" text-anchor="middle" xml:space="preserve"><tspan x="241.23" y="201.9">Splits out each mark.</tspan><tspan x="241.23" y="219.9">The mark is never spoken.</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="sol"><rect x="-77.56" y="540" width="155.12" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="567.6" text-anchor="middle">Sol · voice agent</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="tap"><rect x="179.43" y="540" width="123.6" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="241.23" y="567.6" text-anchor="middle">Playback tap</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="sdk"><rect x="444.29" y="540" width="128.02" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="508.3" y="567.6" text-anchor="middle">Browser SDK</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" da