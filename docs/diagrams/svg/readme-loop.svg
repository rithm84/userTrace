 data-id="L_validate_credit_0"><rect x="120.16" y="768.5" width="144.16" height="21" rx="3" fill="var(--_bg)"/><text x="192.24" y="783.9" text-anchor="middle">participation complete</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-lean-r people" data-id="feedback" transform="translate(192.24,131.5)"><polygon points="-122.49,-43.5 144.24,-43.5 122.49,43.5 -144.24,43.5" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">1 · Feedback</tspan><tspan x="0" y="5.6">A customer asks for a feature</tspan><tspan x="0" y="26.6">or reports a problem</tspan></text></g><g class="pele-node pele-shape-rect observation" data-id="interview" transform="translate(192.24,332.5)"><rect x="-135.82" y="-43.5" width="271.63" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">3 · Voice interview</tspan><tspan x="0" y="5.6">The agent asks while</tspan><tspan x="0" y="26.6">the customer shows the workflow</tspan></text></g><g class="pele-node pele-shape-stadium people" data-id="validate" transform="translate(192.24,699)"><rect x="-109.11" y="-43.5" width="218.22" height="87" rx="43.5" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">6 · Validation</tspan><tspan x="0" y="5.6">The same customer</tspan><tspan x="0" y="26.6">tries the new version</tspan></text></g><g class="pele-node pele-shape-rect outcome" data-id="credit" transform="translate(192.24,853.5)"><rect x="-69.77" y="-33" width="139.54" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">7 · Rewarded</tspan><tspan x="0" y="16.1">For taking part</tspan></text></g><g class="pele-node pele-shape-rect reasoning" data-id="intake" transform="translate(546.14,224)"><rect x="-99.38" y="-33" width="198.75" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">2 · Intake</tspan><tspan x="0" y="16.1">Spots a Product Signal</tspan></text></g><g class="pele-node pele-shape-hex gate" data-id="gate" transform="translate(546.14,441)"><polygon points="-145.17,-33 145.17,-33 161.67,0 145.17,33 -145.17,33 -161.67,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">4 · Implementation Gate</tspan><tspan x="0" y="16.1">Weighs evidence, scope, and policy</tspan></text></g><g class="pele-node pele-shape-rect runtime" data-id="build" transform="translate(546.14,590.5)"><rect x="-136.74" y="-43.5" width="273.49" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">5 · Build</tspan><tspan x="0" y="5.6">A coding agent changes the code</tspan><tspan x="0" y="26.6">in an isolated workspace</tspan></text></g><g class="pele-node pele-shape-doc neutral" data-id="explained" transform="translate(862.28,945.5)"><path d="M-106.47,-38H106.47V28q-53.24,-12 -106.47,0t-106.47,0Z" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.9">Case File explaining why</tspan><tspan x="0" y="11.1">No PR</tspan></text></g><g class="pele-node pele-shape-doc outcome" data-id="delivered" transform="translate(862.28,853.5)"><path d="M-91.58,-38H91.58V28q-45.79,-12 -91.58,0t-91.58,0Z" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.9" font-weight="var(--_w)">7 · Delivered</tspan><t