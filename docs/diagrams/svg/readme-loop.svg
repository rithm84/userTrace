<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1017 1032" width="1017" height="1032" style="max-width:100%;height:auto" role="img" aria-label="One customer message → one validated pull request"><title>One customer message → one validated pull request</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1017" height="1032" rx="8"/><svg x="0" y="0" class="pele pele-swimlane" viewBox="0 0 1017 1032" width="1017" height="1032" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="swimlane"><g class="pele-clusters"><g class="pele-cluster pele-lane" data-id="team"><rect x="731.81" y="24" width="260.94" height="983.5" fill="none" stroke="var(--_b)"/><rect x="731.81" y="24" width="260.94" height="40" fill="var(--_a)" stroke="var(--_b)"/><text class="pele-cluster-label" fill="var(--_m)" x="862.28" y="49.6" text-anchor="middle">Product team</text></g><g class="pele-cluster pele-lane" data-id="utrace"><rect x="360.48" y="24" width="371.34" height="983.5" fill="none" stroke="var(--_b)"/><rect x="360.48" y="24" width="371.34" height="40" fill="var(--_a)" stroke="var(--_b)"/><text class="pele-cluster-label" fill="var(--_m)" x="546.14" y="49.6" text-anchor="middle">uTrace</text></g><g class="pele-cluster pele-lane" data-id="customer"><rect x="24" y="24" width="336.48" height="983.5" fill="none" stroke="var(--_b)"/><rect x="24" y="24" width="336.48" height="40" fill="var(--_a)" stroke="var(--_b)"/><text class="pele-cluster-label" fill="var(--_m)" x="192.24" y="49.6" text-anchor="middle">Customer</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_feedback_intake_0"><path d="M325.6,131.5L526.14,131.5C538.54,131.5 546.14,139.1 546.14,151.5L546.14,184"/><path class="pele-marker" d="M546.14,191L542.78,183L549.5,183Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_intake_interview_0"><path d="M446.77,224L212.24,224C199.84,224 192.24,231.6 192.24,244L192.24,282"/><path class="pele-marker" d="M192.24,289L188.88,281L195.6,281Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_interview_gate_0"><path d="M328.05,332.5L526.14,332.5C538.54,332.5 546.14,340.1 546.14,352.5L546.14,401"/><path class="pele-marker" d="M546.14,408L542.78,400L549.5,400Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="ok_1"><path d="M546.14,474L546.14,540"/><path class="pele-marker" d="M546.14,547L542.78,539L549.5,539Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_1"><path d="M707.81,441L962.76,441C975.16,441 982.76,448.6 982.76,461L982.76,925.5C982.76,937.9 980.76,945.5 977.51,945.5L975.76,945.5"/><path class="pele-marker" d="M968.76,945.5L976.76,942.14L976.76,948.86Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_build_validate_0"><path d="M546.14,634L546.14,679C546.14,691.4 538.54,699 526.14,699L308.35,699"/><path class="pele-marker" d="M301.35,699L309.35,695.64L309.35,702.36Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_2"><path d="M83.13,699L54,699C41.6,699 34,706.6 34,719L34,925.5C34,937.9 41.6,945.5 54,945.5L748.81,945.5"/><path class="pele-marker" d="M755.81,945.5L747.81,948.86L747.81,942.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_1"><path d="M192.24,655.5L192.24,461C192.24,448.6 199.84,441 212.24,441L377.48,441" stroke-dasharray="3 4"/><path class="pele-marker" d="M384.48,441L376.48,444.36L376.48,437.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="ok_2"><path d="M192.24,742.5C192.24,749.01 546.14,759.99 546.14,766.5L546.14,791.5C546.14,794.69 862.28,801.06 862.28,804.25L862.28,808.5"/><path class="pele-marker" d="M862.28,815.5L858.92,807.5L86