<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1041 699" width="1041" height="699" style="max-width:100%;height:auto" role="img" aria-label="Credential custody · long-lived secrets stay server-side"><title>Credential custody · long-lived secrets stay server-side</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1041" height="699" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1041 699" width="1041" height="699" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="row_2"><rect x="24" y="587" width="849.64" height="88" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="row_1"><rect x="280.24" y="145" width="736.22" height="369" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="pcc"><rect x="709.68" y="165" width="286.78" height="291" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="773.48" y="190.6" text-anchor="middle">Pipecat Cloud</text></g><g class="pele-cluster" data-id="supa"><rect x="300.24" y="165" width="361.44" height="329" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="376.49" y="190.6" text-anchor="middle">Supabase project</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_secrets_computes_0"><path d="M480.96,315L480.96,381"/><path class="pele-marker" d="M480.96,388L477.6,380L484.32,380Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_vset_voice_0"><path d="M853.07,315L853.07,381"/><path class="pele-marker" d="M853.07,388L849.71,380L856.43,380Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_workspace_firewall_0"><path d="M290.26,631L385.27,631"/><path class="pele-marker" d="M392.27,631L384.27,634.36L384.27,627.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_firewall_openai_0"><path d="M569.65,631L726.15,631"/><path class="pele-marker" d="M733.15,631L725.15,634.36L725.15,627.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_env_secrets_0"><path d="M599.01,72C599.01,82.25 480.96,82.25 480.96,92.5L480.96,218"/><path class="pele-marker" d="M480.96,225L477.6,217L484.32,217Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_env_vset_0"><path d="M735.02,72C735.02,82.25 853.07,82.25 853.07,92.5L853.07,218"/><path class="pele-marker" d="M853.07,225L849.71,217L856.43,217Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_computes_firewall_0"><path d="M480.96,454L480.96,600"/><path class="pele-marker" d="M480.96,607L477.6,599L484.32,599Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_secrets_computes_0"><rect x="391.75" y="337.5" width="178.41" height="21" rx="3" fill="var(--_bg)"/><text x="480.96" y="352.9" text-anchor="middle">injected into every compute</text></g><g class="pele-edge-label" data-id="L_vset_voice_0"><rect x="818.72" y="337.5" width="68.69" height="21" rx="3" fill="var(--_bg)"/><text x="853.07" y="352.9" text-anchor="middle">secret set</text></g><g class="pele-edge-label" data-id="L_workspace_firewall_0"><rect x="312.76" y="620.5" width="50.01" height="21" rx="3" fill="var(--_bg)"/><text x="337.76" y="635.9" text-anchor="middle">egress</text></g><g class="pele-edge-label" data-id="L_firewall_openai_0"><rect x="592.15" y="620.5" width="111.5" height="21" rx="3" fill="var(--_bg)"/><text x="647.9" y="635.9" text-anchor="middle">credential added</text></g><g class="pele-edge-label" data-id="L_env_secrets_0"><rect x="363.96" y="94.5" width="233.99" height="21" rx="3" fill="var(--_bg)"/><text x="480.96" y="109.9" text-anchor="middle">deployment sync · verified by digest</text></g><g class="pele-edge-label" data-id="L_env_vset_0"><rect x="794.6" y="94.5" width="116.93" height="21" rx="3" fill="var(--_bg)"/><text x="853.07" y="109.9" text-anchor="middle">deploy.py secrets</text></g><g class="pele-edge-label" data-id="L_computes_firewall_0"><rect x="418.6" y="536.5" width="124.72" height="21" rx="3" fill="var(--_bg)"/><text x="480.96" y="551.9" text-anchor="middle">egress header rule</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-lean-r neutral" data-id="env" transform="translate(667.01,48)"><polygon points="-120.01,-24 132.01,-24 120.01,24 -132.01,24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Operator's local environment</text></g><g class="pele-node pele-shape-cyl gate" data-id="secrets" transform="translate(480.96,270)"><path d="M-120.27,-33A120.27,12 0 0 1 120.27,-33V33A120.27,12 0 0 1 -120.27,33Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-120.27,-33A120.27,12 0 0 0 120.27,-33" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="1.1" font-weight="var(--_w)">Compute project secrets</tspan><tspan x="0" y="22.1">One set for the whole project</tspan></text></g><g class="pele-node pele-shape-rect runtime" data-id="computes" transform="translate(480.96,421)"><rect x="-160.72" y="-33" width="321.44" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">api + worker computes</tspan><tspan x="0" y="16.1">Every secret as an environment variable</tspan></text></g><g class="pele-node pele-shape-cyl gate" data-id="vset" transform="translate(853.07,270)"><path d="M-123.39,-33A123.39,12 0 0 1 123.39,-33V33A123.39,12 0 0 1 -123.39,33Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-123.39,-33A123.39,12 0 0 0 123.39,-33" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="1.1" font-weight="var(--_w)">utrace-voice-agent-secrets</tspan><tspan x="0" y="22.1">Copies the voice agent needs</tspan></text></g><g class="pele-node pele-shape-rect runtime" data-id="voice" transform="translate(853.07,412)"><rect x="-60.25" y="-24" width="120.5" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Voice agent</text></g><g class="pele-node pele-shape-rect observation" data-id="workspace" transform="translate(167.13,631)"><rect x="-123.13" y="-24" width="246.26" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Workspace sandbox · no key</text></g><g class="pele-node pele-shape-hex gate" data-id="firewall" transform="translate(480.96,631)"><polygon points="-76.69,-24 76.69,-24 88.69,0 76.69,24 -76.69,24 -88.69,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Sandbox firewall</text></g><g class="pele-node pele-shape-rect reasoning" data-id="openai" transform="translate(793.4,631)"><rect x="-60.25" y="-24" width="120.5" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">OpenAI API</text></g></g></svg></svg>
