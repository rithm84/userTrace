)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Kind?</text></g><g class="pele-node pele-shape-diam gate" data-id="run" transform="translate(398.27,334.64)"><polygon points="0,-49.06 78.5,0 0,49.07 -78.5,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Newest run?</text></g><g class="pele-node pele-shape-diam gate" data-id="supported" transform="translate(729.83,554.11)"><polygon points="0,-46.84 74.94,0 0,46.84 -74.94,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Confirmed?</text></g><g class="pele-node pele-shape-diam gate" data-id="contradicted" transform="translate(477.85,554.11)"><polygon points="0,-46.84 74.94,0 0,46.84 -74.94,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Confirmed?</text></g><g class="pele-node pele-shape-diam gate" data-id="judged" transform="translate(924.62,554.11)"><polygon points="0,-49.9 79.85,0 0,49.9 -79.85,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Judged met?</text></g><g class="pele-node pele-shape-rect async" data-id="rerun" transform="translate(221.25,768.51)"><rect x="-127.39" y="-24" width="254.78" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Agent asks for the check again</text></g><g class="pele-node pele-shape-stadium external" data-id="unmet" transform="translate(562.69,768.51)"><rect x="-166.05" y="-24" width="332.1" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Criterion unconfirmed, failed, or unclear</text></g><g class="pele-node pele-shape-stadium outcome" data-id="proven" transform="translate(946.33,768.51)"><rect x="-169.59" y="-24" width="339.18" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="p