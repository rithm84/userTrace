el" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Supabase Auth</tspan><tspan x="0" y="5.6">Verified auth subject</tspan><tspan x="0" y="26.6">No client scope from metadata</tspan></text></g><g class="pele-node pele-shape-cyl outcome" data-id="members" transform="translate(178.93,516.5)"><path d="M-134.93,-43.5A134.93,12 0 0 1 134.93,-43.5V43.5A134.93,12 0 0 1 -134.93,43.5Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-134.93,-43.5A134.93,12 0 0 0 134.93,-43.5" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.4" font-weight="var(--_w)">Staff membership</tspan><tspan x="0" y="11.6">client_id + client_member_id</tspan><tspan x="0" y="32.6">One owner; zero or more admins</tspan></text></g><g class="pele-node pele-shape-rect people" data-id="dashboard" transform="translate(178.93,699)"><rect x="-106.03" y="-54" width="212.06" height="108" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9" font-weight="var(--_w)">Dashboard authority</tspan><tspan x="0" y="-4.9">Read-only member list</tspan><tspan x="0" y="16.1">Authorized client records</tspan><tspan x="0" y="37.1">Audited case stop</tspan></text></g><g class="pele-node pele-shape-lean-r external" data-id="revoke" transform="translate(356.43,304)"><polygon points="-108.26,-24 120.26,-24 108.26,24 -120.26,24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Offboarding or revocation</text></g><g class="pele-node pele-shape-hex gate" data-id="claim" transform="translate(534.48,504.5)"><polygon points="-106.46,-43.5 106.46,-43.5 128.21,0 106.46,43.5 -106.46,43.5 -128.21,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Invitation claim</tspan><tspan x="0" y="5.6">Dis