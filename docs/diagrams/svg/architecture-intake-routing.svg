<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 894 838" width="894" height="838" style="max-width:100%;height:auto" role="img" aria-label="Intake · decide once, then commit the authorized outcome"><title>Intake · decide once, then commit the authorized outcome</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="894" height="838" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 894 838" width="894" height="838" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_discord_jev_0"><path d="M382.49,132L382.49,198"/><path class="pele-marker" d="M382.49,205L379.13,197L385.85,197Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_jev_decision_0"><path d="M277.6,313L277.6,539"/><path class="pele-marker" d="M277.6,546L274.24,538L280.96,538Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_jev_assist_0"><path d="M487.38,313L487.38,379" stroke-dasharray="3 4"/><path class="pele-marker" d="M487.38,386L484.02,378L490.74,378Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_assist_decision_0"><path d="M487.38,473L487.38,539" stroke-dasharray="3 4"/><path class="pele-marker" d="M487.38,546L484.02,538L490.74,538Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_decision_signal_0"><path d="M302.67,633C302.67,642.24 120.7,644.26 120.7,653.5L120.7,699"/><path class="pele-marker" d="M120.7,706L117.34,698L124.06,698Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_decision_noise_0"><path d="M382.49,633L382.49,699"/><path class="pele-marker" d="M382.49,706L379.13,698L385.85,698Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_1"><path d="M462.32,633C462.32,639.82 708.77,646.68 708.77,653.5L708.77,699"/><path class="pele-marker" d="M708.77,706L705.41,698L712.13,698Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_discord_jev_0"><rect x="354.37" y="154.5" width="56.24" height="21" rx="3" fill="var(--_bg)"/><text x="382.49" y="169.9" text-anchor="middle">analyze</text></g><g class="pele-edge-label" data-id="L_jev_decision_0"><rect x="256.1" y="419" width="43.01" height="21" rx="3" fill="var(--_bg)"/><text x="277.6" y="434.4" text-anchor="middle">ready</text></g><g class="pele-edge-label" data-id="L_jev_assist_0"><rect x="454.59" y="335.5" width="65.58" height="21" rx="3" fill="var(--_bg)"/><text x="487.38" y="350.9" text-anchor="middle">uncertain</text></g><g class="pele-edge-label" data-id="L_assist_decision_0"><rect x="466.27" y="495.5" width="42.23" height="21" rx="3" fill="var(--_bg)"/><text x="487.38" y="510.9" text-anchor="middle">result</text></g><g class="pele-edge-label" data-id="L_decision_signal_0"><rect x="87.13" y="655.5" width="67.14" height="21" rx="3" fill="var(--_bg)"/><text x="120.7" y="670.9" text-anchor="middle">new case</text></g><g class="pele-edge-label" data-id="L_decision_noise_0"><rect x="361.76" y="655.5" width="41.46" height="21" rx="3" fill="var(--_bg)"/><text x="382.49" y="670.9" text-anchor="middle">noise</text></g><g class="pele-edge-label" data-id="blocked_1"><rect x="691.54" y="655.5" width="34.46" height="21" rx="3" fill="var(--_bg)"/><text x="708.77" y="670.9" text-anchor="middle">held</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-lean-r people" data-id="discord" transform="translate(382.49,78)"><polygon points="-127.83,-54 154.83,-54 127.83,54 -154.83,54" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9" font-weight="var(--_w)">Di