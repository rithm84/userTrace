<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1027 1010" width="1027" height="1010" style="max-width:100%;height:auto" role="img" aria-label="Voice pipeline · audio in, words and gestures out"><title>Voice pipeline · audio in, words and gestures out</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1027" height="1010" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1027 1010" width="1027" height="1010" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="row_speak"><rect x="793.7" y="360" width="208.38" height="451" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="row_answer"><rect x="422.03" y="24" width="219.17" height="572" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="row_hear"><rect x="24" y="535" width="230.74" height="451" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_daily_in_mic_0"><path d="M139.37,603L139.37,669"/><path class="pele-marker" d="M139.37,676L136.01,668L142.73,668Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_mic_flux_0"><path d="M139.37,724L139.37,790"/><path class="pele-marker" d="M139.37,797L136.01,789L142.73,789Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_flux_turns_0"><path d="M139.37,845L139.37,911"/><path class="pele-marker" d="M139.37,918L136.01,910L142.73,910Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_screen_sol_0"><path d="M531.62,528L531.62,462"/><path class="pele-marker" d="M531.62,455L534.98,463L528.26,463Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_sol_listening_0"><path d="M531.62,407L531.62,341"/><path class="pele-marker" d="M531.62,334L534.98,342L528.26,342Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_listening_follower_0"><path d="M531.62,286L531.62,220"/><path class="pele-marker" d="M531.62,213L534.98,221L528.26,221Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_follower_words_0"><path d="M531.62,165L531.62,99"/><path class="pele-marker" d="M531.62,92L534.98,100L528.26,100Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_eleven_daily_out_0"><path d="M897.89,428L897.89,494"/><path class="pele-marker" d="M897.89,501L894.53,493L901.25,493Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_daily_out_tap_0"><path d="M897.89,549L897.89,615"/><path class="pele-marker" d="M897.89,622L894.53,614L901.25,614Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_tap_preview_0"><path d="M897.89,670L897.89,736"/><path class="pele-marker" d="M897.89,743L894.53,735L901.25,735Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_turns_screen_0"><path d="M234.74,942L254.74,942C259.86,942 270.11,552 275.24,552L461.71,552"/><path class="pele-marker" d="M468.71,552L460.71,555.36L460.71,548.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_words_eleven_0"><path d="M621.2,68L766.2,68C775.2,68 784.7,404 793.7,404L831.09,404"/><path class="pele-marker" d="M838.09,404L830.09,407.36L830.09,400.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cues_sol_0"><path d="M254.74,471C264.99,471 264.99,431 275.24,431L462.6,431"/><path class="pele-marker" d="M469.6,431L461.6,434.36L461.6,427.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="async_1"><path d="M834.09,646L793.7,646C724.8,646 724.8,942 655.9,942L241.74,942" stroke-dasharray="3