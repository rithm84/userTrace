<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1312 399" width="1312" height="399" style="max-width:100%;height:auto" role="img" aria-label="Control plane · durable authority and external execution"><title>Control plane · durable authority and external execution</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1312" height="399" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1312 399" width="1312" height="399" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="row_2"><rect x="142.32" y="248" width="1144.74" height="127" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="row_1"><rect x="24" y="24" width="987.35" height="151" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_input_controllers_0"><path d="M305.59,99.5L417.7,99.5"/><path class="pele-marker" d="M424.7,99.5L416.7,102.86L416.7,96.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_controllers_commit_0"><path d="M657.23,99.5L755.34,99.5"/><path class="pele-marker" d="M762.34,99.5L754.34,102.86L754.34,96.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_dispatch_executor_0"><path d="M980.31,311.5L793.48,311.5"/><path class="pele-marker" d="M786.48,311.5L794.48,308.14L794.48,314.86Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_executor_inbox_0"><path d="M563.76,311.5L432.95,311.5"/><path class="pele-marker" d="M425.95,311.5L433.95,308.14L433.95,314.86Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_commit_dispatch_0"><path d="M876.84,155L876.84,224C876.84,233.33 1123.68,238.67 1123.68,248L1123.68,261"/><path class="pele-marker" d="M1123.68,268L1120.32,260L1127.04,260Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_inbox_controllers_0"><path d="M294.13,268L294.13,248C294.13,238.67 540.97,233.33 540.97,224L540.97,150"/><path class="pele-marker" d="M540.97,143L544.33,151L537.61,151Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_input_controllers_0"><rect x="338.96" y="89" width="56.24" height="21" rx="3" fill="var(--_bg)"/><text x="367.08" y="104.4" text-anchor="middle">validate</text></g><g class="pele-edge-label" data-id="L_controllers_commit_0"><rect x="679.73" y="89" width="53.11" height="21" rx="3" fill="var(--_bg)"/><text x="706.29" y="104.4" text-anchor="middle">commit</text></g><g class="pele-edge-label" data-id="L_dispatch_executor_0"><rect x="815.98" y="301" width="141.83" height="21" rx="3" fill="var(--_bg)"/><text x="886.89" y="316.4" text-anchor="middle">authorized Command</text></g><g class="pele-edge-label" data-id="L_executor_inbox_0"><rect x="455.45" y="301" width="85.81" height="21" rx="3" fill="var(--_bg)"/><text x="498.35" y="316.4" text-anchor="middle">typed Result</text></g><g class="pele-edge-label" data-id="L_commit_dispatch_0"><rect x="851.83" y="201" width="50.03" height="21" rx="3" fill="var(--_bg)"/><text x="876.84" y="216.4" text-anchor="middle">outbox</text></g><g class="pele-edge-label" data-id="L_inbox_controllers_0"><rect x="486.39" y="201" width="109.15" height="21" rx="3" fill="var(--_bg)"/><text x="540.97" y="216.4" text-anchor="middle">freshness check</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-lean-r people" data-id="input" transform="translate(180.23,99.5)"><polygon points="-114.48,-43.5 136.23,-43.5 114.48,43.5 -136.23,43.5" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Authenticated input</tspan><tspan x="0" y="5.6">Intake, transcript, telemetry</tspan><tspan x="0" y="26.6">Typed source and revision</tspan></text></g><g class="pele-node pele-shape-rect runtime" data-id="controllers" transform="translate(540.97,99.5)"><rect x="-116.26" y="-43.5" width="232.53" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Lifecycle controllers</tspan><tspan x="0" y="5.6">Evidence and policy checks</tspan><tspan x="0" y="26.6">Models supply proposals</tspan></text></g><g class="pele-node pele-shape-cyl outcome" data-id="commit" transform="translate(876.84,99.5)"><path d="M-114.5,-43.5A114.5,12 0 0 1 114.5,-43.5V43.5A114.5,12 0 0 1 -114.5,43.5Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-114.5,-43.5A114.5,12 0 0 0 114.5,-43.5" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.4" font-weight="var(--_w)">Supabase Postgres</tspan><tspan x="0" y="11.6">One atomic commit:</tspan><tspan x="0" y="32.6">event + projection + outbox</tspan></text></g><g class="pele-node pele-shape-h-cyl runtime" data-id="dispatch" transform="translate(1123.68,311.5)"><path d="M-131.38,-43.5H131.38A12,43.5 0 0 1 131.38,43.5H-131.38A12,43.5 0 0 1 -131.38,-43.5Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M131.38,-43.5A12,43.5 0 0 0 131.38,43.5" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Durable dispatch</tspan><tspan x="0" y="5.6">Queues delivery, Cron wakeups</tspan><tspan x="0" y="26.6">Job + Command identities</tspan></text></g><g class="pele-node pele-shape-rect runtime" data-id="executor" transform="translate(675.12,311.5)"><rect x="-111.36" y="-43.5" width="222.72"