b)"/><text class="pele-label" x="0" y="-29.9" text-anchor="middle">Re-entry checks</text><text class="pele-state-description" font-size="14" x="0" y="5.9" text-anchor="middle">Same identity</text><text class="pele-state-description" font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="0" y="25.4">Current authority, budgets,</tspan><tspan x="0" y="43.4">readiness</tspan></text></g><g class="pele-node pele-state runtime" data-id="resumed" transform="translate(1048.29,386.5)"><rect x="-115.22" y="-39.5" width="230.45" height="79" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-115.22,0.5H115.23" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-11.9" text-anchor="middle">Resumed</text><text class="pele-state-description" font-size="14" x="0" y="23.9" text-anchor="middle">Same deadline, no budget reset</text></g><g class="pele-node pele-state-start" data-id="deadline_start" transform="translate(140.69,386.5)"><circle r="7" fill="var(--_l)"/></g></g></svg></svg>
