<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1190 620" width="1190" height="620" style="max-width:100%;height:auto" role="img" aria-label="Zero screenshots · the agent reads structure, not pixels"><title>Zero screenshots · the agent reads structure, not pixels</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1190" height="620" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1190 620" width="1190" height="620" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="utrace"><rect x="227.4" y="265" width="937.67" height="171" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="266.29" y="290.6" text-anchor="middle">uTrace</text></g><g class="pele-cluster" data-id="preview"><rect x="24" y="24" width="841.39" height="168" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="144.02" y="49.6" text-anchor="middle">Preview of the client's product</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_browser_server_0"><path d="M345.89,118L574.76,118"/><path class="pele-marker" d="M581.76,118L573.76,121.36L573.76,114.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_trace_evidence_0"><path d="M461.64,360.5L502.64,360.5"/><path class="pele-marker" d="M509.64,360.5L501.64,363.86L501.64,357.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="ok_1"><path d="M785.73,360.5L906.44,360.5"/><path class="pele-marker" d="M913.44,360.5L905.44,363.86L905.44,357.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_browser_trace_0"><path d="M194.94,172L194.94,192C194.94,202.25 306.28,202.25 306.28,212.5L306.28,237.5C306.28,251.25 354.52,251.25 354.52,265L354.52,310"/><path class="pele-marker" d="M354.52,317L351.16,309L357.88,309Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_server_trace_0"><path d="M713.57,172L713.57,237.5C713.57,245.92 354.52,256.58 354.52,265L354.52,310"/><path class="pele-marker" d="M354.52,317L351.16,309L357.88,309Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="ok_2"><path d="M1029.25,404L1029.25,481.5C1029.25,485.34 678.69,493.03 678.69,496.88L678.69,502"/><path class="pele-marker" d="M678.69,509L675.33,501L682.05,501Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_browser_cursor_0"><path d="M194.94,172L194.94,192C194.94,228.5 151.78,228.5 151.78,265L151.78,436C151.78,466 516.87,466 516.87,496L516.87,502" stroke-dasharray="3 4"/><path class="pele-marker" d="M516.87,509L513.51,501L520.23,501Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_browser_server_0"><rect x="368.39" y="107.5" width="183.87" height="21" rx="3" fill="var(--_bg)"/><text x="460.32" y="122.9" text-anchor="middle">traceparent on each API call</text></g><g class="pele-edge-label" data-id="ok_1"><rect x="808.23" y="350" width="75.7" height="21" rx="3" fill="var(--_bg)"/><text x="846.09" y="365.4" text-anchor="middle">typed facts</text></g><g class="pele-edge-label" data-id="L_browser_trace_0"><rect x="252.47" y="214.5" width="107.61" height="21" rx="3" fill="var(--_bg)"/><text x="306.28" y="229.9" text-anchor="middle">redacted events</text></g><g class="pele-edge-label" data-id="L_server_trace_0"><rect x="690.9" y="214.5" width="45.35" height="21" rx="3" fill="var(--_bg)"/><text x="713.57" y="229.9" text-anchor="middle">spans</text></g><g class="pele-edge-label" data-id="ok_2"><rect x="950.94" y="458.5" width="156.62" height="21" rx="3" fill="var(--_bg)"/><text x="1029.25" y="473.9" text-anchor="middle">names the exact control</text></g><g class="pele-edge-label" data-id="L_browser_cursor_0"><rect x="106.15" y="340" width="91.24" height="21" rx="3" fill="var(--_bg)"/><text x="151.78" y="355.4" text-anchor="middle">live geometry</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect observation" data-id="browser" transform="translate(194.94,118)"><rect x="-150.94" y="-54" width="301.89" height="108" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9" font-weight="var(--_w)">Browser SDK</tspan><tspan x="0" y="-4.9">DOM + ARIA semantics, routes</tspan><tspan x="0" y="16.1">Annotated controls with live geometry</tspan><tspan x="0" y="37.1">Clicks, inputs, chart state</tspan></text></g><g class="pele-node pele-shape-rect observation" data-id="server" transform="translate(713.57,118)"><rect x="-131.82" y="-54" width="263.63" height="108" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9" font-weight="var(--_w)">Server SDK</tspan><tspan x="0" y="-4.9">OpenTelemetry spans</tspan><tspan x="0" y="16.1">API, database, product events</tspan><tspan x="0" y="37.1">Preview-only, inert in production</tspan></text></g><g class="pele-node pele-shape-rect runtime" data-id="trace" transform="translate(354.52,360.5)"><rect x="-107.12" y="-43.5" width="214.24" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">One trace per action</tspan><tspan x="0" y="5.6">Click → API call →</tspan><tspan x="0" y="26.6">server span → SQL query</tspan></text></g><g class="pele-node pele-shape-cyl outcome" data-id="evidence" transform="translate(647.69,360.5)"><path d="M-138.05,-43.5A138.05,12 0 0 1 138.05,-43.5V43.5A138.05,12 0 0 1 -138.05,43.5Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-138.05,-43.5A138.05,12 0 0 0 138.05,-43.5" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.4" font-weight="var(--_w)">Typed evidence · Supabase</tspan><tspan x="0" y="11.6">Redacted, authenticated, ordered</tspan><tspan x="0" y="32.6">Per session, no pixels ever stored</tspan></text></g><g class="pele-node pele-shape-rect reasoning" data-id="agents" transform="translate(1029.25,360.5)"><rect x="-115.82" y="-43.5" width="231.63" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Agents reason on facts</tspan><tspan x="0" y="5.6">Hear what the customer did</tspan><tspan x="0" y="26.6">Validation cites real events</tspan></text></g><g class="pele-node pele-shape-stadium observation" data-id="cursor" transform="translate(597.78,552.5)"><rect x="-164.41" y="-43.5" width="328.83" height="87" rx="43.5" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Agent cursor · Chrome extension</tspan><tspan x="0" y="5.6">Element geometry from the SDK</tspan><tspan x="0" y="26.6">Survives any restyle</tspan></text></g></g></svg></svg>
