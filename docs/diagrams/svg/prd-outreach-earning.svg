<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1341 854" width="1341" height="854" style="max-width:100%;height:auto" role="img" aria-label="Outreach Offers · how a case's end decides the reward"><title>Outreach Offers · how a case's end decides the reward</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1341" height="854" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1341 854" width="1341" height="854" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_offer_ending_0"><path d="M682.16,90L682.16,131"/><path class="pele-marker" d="M682.16,138L678.8,130L685.52,130Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="ok_1"><path d="M645.18,258.6C645.18,306.66 172.4,306.66 172.4,354.72L172.4,541.45C172.4,571.45 439.39,571.45 439.39,601.45L439.39,607.45"/><path class="pele-marker" d="M439.39,614.45L436.03,606.45L442.75,606.45Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="ok_2"><path d="M661.18,268.6C661.18,311.66 502.32,311.66 502.32,354.72L502.32,607.45"/><path class="pele-marker" d="M502.32,614.45L498.96,606.45L505.68,606.45Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ending_fulfilled_0"><path d="M703.15,268.6C703.15,285.41 845.22,285.41 845.22,302.22L845.22,347.72"/><path class="pele-marker" d="M845.22,354.72L841.86,346.72L848.58,346.72Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="ok_3"><path d="M802.11,514.51L802.11,586.95C802.11,590.94 565.25,598.33 565.25,602.33L565.25,607.45"/><path class="pele-marker" d="M565.25,614.45L561.89,606.45L568.61,606.45Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_1"><path d="M894.85,510.43C894.85,536.19 947.22,536.19 947.22,561.95L947.22,586.95C947.22,598.7 1105.74,598.7 1105.74,610.45L1105.74,616.45"/><path class="pele-marker" d="M1105.74,623.45L1102.38,615.45L1109.1,615.45Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="blocked_2"><path d="M719.15,258.6C719.15,280.69 1169.46,286.38 1169.46,308.47L1169.46,541.45C1169.46,575.95 1121.74,575.95 1121.74,610.45L1121.74,616.45"/><path class="pele-marker" d="M1121.74,623.45L1118.38,615.45L1125.1,615.45Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_earned_credit_0"><path d="M502.32,680.45L502.32,746.45"/><path class="pele-marker" d="M502.32,753.45L498.96,745.45L505.68,745.45Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="ok_1"><rect x="26" y="437.59" width="292.8" height="21" rx="3" fill="var(--_bg)"/><text x="172.4" y="452.99" text-anchor="middle">interview done, gate chose no implementation</text></g><g class="pele-edge-label" data-id="ok_2"><rect x="338.8" y="437.59" width="327.03" height="21" rx="3" fill="var(--_bg)"/><text x="502.32" y="452.99" text-anchor="middle">implementation built, participated through validation</text></g><g class="pele-edge-label" data-id="L_ending_fulfilled_0"><rect x="754.45" y="304.22" width="181.53" height="21" rx="3" fill="var(--_bg)"/><text x="845.22" y="319.62" text-anchor="middle">uTrace or the client ended it</text></g><g class="pele-edge-label" data-id="ok_3"><rect x="787.22" y="563.95" width="29.78" height="21" rx="3" fill="var(--_bg)"/><text x="802.11" y="579.35" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="blocked_1"><rect x="837" y="563.95" width="220.45" height="21" rx="3" fill="var(--_bg)"/><text x="947.22" y="579.35" text-anchor="middle">no, or stopped before participation</text></g><g class="pele-edge-label" data-id="blocked_2"><rect x="1024.6" y="437.59" width="289.71" height="21" rx="3" fill="var(--_bg)"/><text x="1169.46" y="452.99" text-anchor="middle">participant cancelled, declined, or abandoned</text></g><g class="pele-edge-label" data-id="L_earned_credit_0"><rect x="449.3" y="702.95" width="106.03" height="21" rx="3" fill="var(--_bg)"/><text x="502.32" y="718.35" text-anchor="middle">uTrace issues it</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium people" data-id="offer" transform="translate(682.16,57)"><rect x="-159.45" y="-33" width="318.9" height="66" rx="33" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Private invitation</tspan><tspan x="0" y="16.1">Reward reserved against the budget</tspan></text></g><g class="pele-node pele-shape-diam gate" data-id="ending" transform="translate(682.16,209.86)"><polygon points="0,-71.86 114.98,0 0,71.86 -114.98,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">How did the case end?</text></g><g class="pele-node pele-shape-diam gate" data-id="fulfilled" transform="translate(845.22,448.09)"><polygon points="0,-93.36 149.38,0 0,93.37 -149.38,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Participant fulfilled</tspan><tspan x="0" y="16.1">everything requested so far?</tspan></text></g><g class="pele-node pele-shape-rect outcome" data-id="earned" transform="translate(502.32,647.45)"><rect x="-114.93" y="-33" width="229.86" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Reward earned</tspan><tspan x="0" y="16.1">Owed even if issuance fails</tspan></text></g><g class="pele-node pele-shape-stadium neutral" data-id="none" transform="translate(1113.74,647.45)"><rect x="-62.9" y="-24" width="125.79" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">No reward</text></g><g class="pele-node pele-shape-doc outcome" data-id="credit" transform="translate(502.32,791.45)"><path d="M-181.19,-38H181.19V28q-90.6,-12 -181.19,0t-181.19,0Z" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.9" font-weight="var(--_w)">Reward issued</tspan><tspan x="0" y="11.1">e.g. an invoice credit on the customer account</tspan></text></g></g></svg></svg>
