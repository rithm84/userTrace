<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1373 555" width="1373" height="555" style="max-width:100%;height:auto" role="img" aria-label="Security boundaries · authority stays outside model and product code"><title>Security boundaries · authority stays outside model and product code</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1373" height="555" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1373 555" width="1373" height="555" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="row_1"><rect x="24" y="24" width="1324.83" height="507" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="isolated"><rect x="983.89" y="204" width="344.94" height="307" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="1148.38" y="229.6" text-anchor="middle">Isolated compute · evidence, not authority</text></g><g class="pele-cluster" data-id="authority"><rect x="488.67" y="204" width="330.16" height="306" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="606.91" y="229.6" text-anchor="middle">Control plane · sole authority</text></g><g class="pele-cluster" data-id="untrusted"><rect x="44" y="44" width="334.09" height="307" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="163.14" y="69.6" text-anchor="middle">No authority · untrusted input</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_content_models_0"><path d="M211.05,171L211.05,237"/><path class="pele-marker" d="M211.05,244L207.69,236L214.41,236Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_exec_product_0"><path d="M1156.36,331L1156.36,397"/><path class="pele-marker" d="M1156.36,404L1153,396L1159.72,396Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_models_checks_0"><path d="M345.93,287.5L501.67,287.5"/><path class="pele-marker" d="M508.67,287.5L500.67,290.86L500.67,284.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_checks_exec_0"><path d="M798.83,287.5L1040.65,287.5"/><path class="pele-marker" d="M1047.65,287.5L1039.65,290.86L1039.65,284.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_product_records_0"><path d="M1003.89,447.5L983.89,447.5C971.89,447.5 971.89,434.5 959.89,434.5L785.69,434.5"/><path class="pele-marker" d="M778.69,434.5L786.69,431.14L786.69,437.86Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_content_models_0"><rect x="181.37" y="193.5" width="59.35" height="21" rx="3" fill="var(--_bg)"/><text x="211.05" y="208.9" text-anchor="middle">interpret</text></g><g class="pele-edge-label" data-id="L_exec_product_0"><rect x="1103.34" y="353.5" width="106.04" height="21" rx="3" fill="var(--_bg)"/><text x="1156.36" y="368.9" text-anchor="middle">checked artifact</text></g><g class="pele-edge-label" data-id="L_models_checks_0"><rect x="400.59" y="277" width="58.58" height="21" rx="3" fill="var(--_bg)"/><text x="429.88" y="292.4" text-anchor="middle">propose</text></g><g class="pele-edge-label" data-id="L_checks_exec_0"><rect x="868.57" y="277" width="65.58" height="21" rx="3" fill="var(--_bg)"/><text x="901.36" y="292.4" text-anchor="middle">authorize</text></g><g class="pele-edge-label" data-id="L_product_records_0"><rect x="844.83" y="424" width="113.06" height="21" rx="3" fill="var(--_bg)"/><text x="901.36" y="439.4" text-anchor="middle">scoped evidence</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-lean-r neutral" data-id="content" transform="translate(211.05,127.5)"><polygon points="-125.3,-43.5 147.05,-43.5 125.3,43.5 -147.05,43.5" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Untrusted content</tspan><tspan x="0" y="5.6">Speech · docs · DOM · code</tspan><tspan x="0" y="26.6">Data, never instructions</tspan></text></g><g class="pele-node pele-shape-rect reasoning" data-id="models" transform="translate(211.05,287.5)"><rect x="-134.89" y="-43.5" width="269.78" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Model proposals</tspan><tspan x="0" y="5.6">Voice agent · GPT-6.1 Sol · Jev</tspan><tspan x="0" y="26.6">Typed, source-linked intent</tspan></text></g><g class="pele-node pele-shape-hex gate" data-id="checks" transform="translate(653.75,287.5)"><polygon points="-123.33,-43.5 123.33,-43.5 145.08,0 123.33,43.5 -123.33,43.5 -145.08,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Deterministic checks</tspan><tspan x="0" y="5.6">Identity · policy · readiness</tspan><tspan x="0" y="26.6">Freshness · budgets · scope</tspan></text></g><g class="pele-node pele-shape-cyl outcome" data-id="records" transform="translate(653.75,434.5)"><path d="M-124.94,-43.5A124.94,12 0 0 1 124.94,-43.5V43.5A124.94,12 0 0 1 -124.94,43.5Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-124.94,-43.5A124.94,12 0 0 0 124.94,-43.5" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.4" font-weight="var(--_w)">Tenant records</tspan><tspan x="0" y="11.6">Supabase RLS + membership</tspa