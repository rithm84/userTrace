<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1155 794" width="1155" height="794" style="max-width:100%;height:auto" role="img" aria-label="Session credentials · each caller proves itself in its own lane"><title>Session credentials · each caller proves itself in its own lane</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1155" height="794" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 1155 794" width="1155" height="794" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="service_lanes"><rect x="582.37" y="346" width="376.08" height="244" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g><g class="pele-cluster" data-id="participant_lanes"><rect x="247.4" y="24" width="533.62" height="249" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="402.1" y="49.6" text-anchor="middle">Participant browser · no lane credential</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_extension_browser_sdk_0"><path d="M699.9,119L699.9,122.38C699.9,127.44 623.44,127.44 623.44,132.5L623.44,157.5C623.44,162.58 437.21,167.8 437.21,172.88L437.21,178"/><path class="pele-marker" d="M699.9,112L703.26,120L696.54,120Z" fill="var(--_l)" stroke="none"/><path class="pele-marker" d="M437.21,185L433.85,177L440.57,177Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_session_tab_daily_0"><path d="M327.2,112L327.2,273C327.2,280.65 107.34,285.85 107.34,293.5L107.34,437"/><path class="pele-marker" d="M107.34,444L103.98,436L110.7,436Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_session_tab_cp_0"><path d="M343.2,112L343.2,273C343.2,309.5 280.33,309.5 280.33,346L280.33,629.25C280.33,659.88 552.61,659.88 552.61,690.5L552.61,696.5"/><path class="pele-marker" d="M552.61,703.5L549.25,695.5L555.97,695.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_preview_tab_door_0"><path d="M531.22,112L531.22,273C531.22,281.62 726.29,284.88 726.29,293.5L726.29,495"/><path class="pele-marker" d="M726.29,502L722.93,494L729.65,494Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_extension_cp_0"><path d="M715.9,112L715.9,123.7C715.9,131.23 758.01,131.23 758.01,138.75L758.01,273C758.01,282.52 1058.58,290.23 1058.58,299.75L1058.58,629.25C1058.58,657.93 999.71,675.5 903.65,675.5C807.6,675.5 748.72,681.49 748.72,691.25L748.72,696.5"/><path class="pele-marker" d="M748.72,703.5L745.36,695.5L752.08,695.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_browser_sdk_cp_0"><path d="M437.21,233L437.21,273C437.21,309.5 456.17,309.5 456.17,346L456.17,629.25C456.17,659.88 568.61,659.88 568.61,690.5L568.61,696.5"/><path class="pele-marker" d="M568.61,703.5L565.25,695.5L571.97,695.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_door_cp_0"><path d="M726.29,550L726.29,590C726.29,600.25 650.67,600.25 650.67,610.5L650.67,696.5"/><path class="pele-marker" d="M650.67,703.5L647.31,695.5L654.03,695.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_server_sdk_cp_0"><path d="M837.2,454L837.2,590C837.2,600.25 901.6,600.25 901.6,610.5L901.6,635.5C901.6,652.86 869.52,663.5 817.16,663.5C764.81,663.5 732.72,673.76 732.72,690.5L732.72,696.5"/><path class="pele-marker" d="M732.72,703.5L729.36,695.5L736.08,695.5Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-cluster-titles"><g class="pele-cluster-title" data-id="service_lanes"><text fill="none" stroke="color-mix(in srgb,var(--_a) 50%,var(--_bg))" stroke-width="5" stroke-linejoin="round" x="770.41