(862.16,755.03)"><rect x="-115.61" y="-43.5" width="231.22" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">No implementation</tspan><tspan x="0" y="5.6">Participated, not approved</tspan><tspan x="0" y="26.6">Evidence + reason retained</tspan></text></g><g class="pele-node pele-shape-doc outcome" data-id="casefile" transform="translate(1137.14,1275.53)"><path d="M-111.37,-38H111.37V28q-55.68,-12 -111.37,0t-111.37,0Z" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.9" font-weight="var(--_w)">Case File</tspan><tspan x="0" y="11.1">Explains outcome and risk</tspan></text></g><g class="pele-node pele-shape-doc outcome" data-id="pr" transform="translate(1137.14,1126.53)"><path d="M-87.36,-38H87.36V28q-43.68,-12 -87.36,0t-87.36,0Z" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.9" font-weight="var(--_w)">Draft PR</tspan><tspan x="0" y="11.1">Validated work only</tspan></text></g></g></svg></svg>
