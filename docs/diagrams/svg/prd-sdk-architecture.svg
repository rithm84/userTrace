<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 771 1035" width="771" height="1035" style="max-width:100%;height:auto" role="img" aria-label="Structured observation · SDKs and extension"><title>Structured observation · SDKs and extension</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="771" height="1035" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 771 1035" width="771" height="1035" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="utrace"><rect x="96.25" y="684" width="343.34" height="327" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="135.15" y="709.6" text-anchor="middle">uTrace</text></g><g class="pele-cluster" data-id="instrumentation"><rect x="176.04" y="264" width="569.98" height="347" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="461.03" y="289.6" text-anchor="middle">Preview instrumentation</text></g><g class="pele-cluster" data-id="ui"><rect x="120.29" y="24" width="283.06" height="167" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="179.64" y="49.6" text-anchor="middle">Extension UI</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_cp_ext_0"><path d="M197.28,904L197.28,684C197.28,667.13 86.02,667.13 86.02,650.25L86.02,217.75C86.02,204.38 245.81,204.38 245.81,191L245.81,158"/><path class="pele-marker" d="M245.81,151L249.17,159L242.45,159Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ext_sdk_0"><path d="M261.81,151L261.81,236.5C261.81,250.25 365.03,250.25 365.03,264L365.03,317"/><path class="pele-marker" d="M365.03,324L361.67,316L368.39,316Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ext_shared_0"><path d="M277.81,151L277.81,191C277.81,196.13 626.98,206.38 626.98,211.5L626.98,477"/><path class="pele-marker" d="M626.98,484L623.62,476L630.34,476Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_sdk_server_0"><path d="M318.54,411L318.54,477"/><path class="pele-marker" d="M318.54,484L315.18,476L321.9,476Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_sdk_shared_0"><path d="M422.85,411C422.85,421.17 588.08,421.33 588.08,431.5L588.08,477"/><path class="pele-marker" d="M588.08,484L584.72,476L591.44,476Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_shared_ingest_0"><path d="M603.53,571L603.53,656.5C603.53,667.58 330.43,672.92 330.43,684L330.43,737"/><path class="pele-marker" d="M330.43,744L327.07,736L333.79,736Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_server_ingest_0"><path d="M318.54,571L318.54,611C318.54,621.25 263.86,621.25 263.86,631.5L263.86,737"/><path class="pele-marker" d="M263.86,744L260.5,736L267.22,736Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ingest_cp_0"><path d="M322.43,831L322.43,897"/><path class="pele-marker" d="M322.43,904L319.07,896L325.79,896Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_cp_ext_0"><rect x="26" y="427" width="120.04" height="21" rx="3" fill="var(--_bg)"/><text x="86.02" y="442.4" text-anchor="middle">authorized visuals</text></g><g class="pele-edge-label" data-id="L_ext_sdk_0"><rect x="207.23" y="213.5" width="109.16" height="21" rx="3" fill="var(--_bg)"/><text x="261.81" y="228.9" text-anchor="middle">SDK handshake</text></g><g class="pele-edge-label" data-id="L_ext_shared_0"><rect x="603.91" y="213.5" width="46.14" height="21" rx="3" fill="var(--_bg)"/><text x="626.98" y="228.9" text-anchor="middle">attach</text></g><g class="pele-edge-label" data-id="L_sdk_server_0"><rect x="274.46" y="433.5" width="88.15" height="21" rx="3" fill="var(--_bg)"/><text x="318.54" y="448.9" text-anchor="middle">trace context</text></g><g class="pele-edge-label" data-id="L_sdk_shared_0"><rect x="559.18" y="433.5" width="57.8" height="21" rx="3" fill="var(--_bg)"/><text x="588.08" y="448.9" text-anchor="middle">observe</text></g><g class="pele-edge-label" data-id="L_shared_ingest_0"><rect x="559.85" y="633.5" width="87.37" height="21" rx="3" fill="var(--_bg)"/><text x="603.53" y="648.9" text-anchor="middle">observations</text></g><g class="pele-edge-label" data-id="L_server_ingest_0"><rect x="212" y="633.5" width="103.72" height="21" rx="3" fill="var(--_bg)"/><text x="263.86" y="648.9" text-anchor="middle">redacted spans</text></g><g class="pele-edge-label" data-id="L_ingest_cp_0"><rect x="257.35" y="853.5" width="130.16" height="21" rx="3" fill="var(--_bg)"/><text x="322.43" y="868.9" text-anchor="middle">correlated evidence</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect observation" data-id="ext" transform="translate(261.81,107.5)"><rect x="-121.53" y="-43.5" width="243.06" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Browser extension</tspan><tspan x="0" y="5.6">Character · controls · cursor</tspan><tspan x="0" y="26.6">Visual overlays</tspan></text></g><g class="pele-node pele-shape-rect observation" data-id="sdk" transform="translate(365.03,367.5)"><rect x="-109.82" y="-43.5" width="219.65" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_