<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1032 613" width="1032" height="613" style="max-width:100%;height:auto" role="img" aria-label="Voice call · backend setup, one private Daily room"><title>Voice call · backend setup, one private Daily room</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1032" height="613" rx="8"/><svg x="0" y="0" class="pele pele-sequence" viewBox="0 0 1032 613" width="1032" height="613" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="sequence"><g transform="translate(138.46,24)"><g class="pele-lifelines" fill="none" stroke="var(--_b)"><path class="pele-lifeline" data-id="tab" d="M0,44V521"/><path class="pele-lifeline" data-id="api" d="M278.71,44V521"/><path class="pele-lifeline" data-id="daily" d="M537.26,44V521"/><path class="pele-lifeline" data-id="agent" d="M741.33,44V521"/></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i1"><path d="M8,87H271.71"/><path class="pele-marker" d="M278.71,87L270.71,90.36L270.71,83.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="-8" y="79" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="0" y="91.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">1</text></g></g><g class="pele-edge pele-message" data-id="i3"><path d="M286.71,200H530.26"/><path class="pele-marker" d="M537.26,200L529.26,203.36L529.26,196.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="270.71" y="192" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="278.71" y="204.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">2</text></g></g><g class="pele-edge pele-message" data-id="i4"><path d="M529.26,237H285.71" stroke-dasharray="4 4"/><path class="pele-marker" d="M278.71,237L286.71,233.64L286.71,240.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="529.26" y="229" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="537.26" y="241.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">3</text></g></g><g class="pele-edge pele-message" data-id="i5"><path d="M286.71,274H734.33"/><path class="pele-marker" d="M741.33,274L733.33,277.36L733.33,270.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="270.71" y="266" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="278.71" y="278.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">4</text></g></g><g class="pele-edge pele-message" data-id="i7"><path d="M270.71,369H7" stroke-dasharray="4 4"/><path class="pele-marker" d="M0,369L8,365.64L8,372.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="270.71" y="361" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="278.71" y="373.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">5</text></g></g><g class="pele-edge pele-message" data-id="i8"><path d="M8,406H530.26"/><path class="pele-marker" d="M537.26,406L529.26,409.36L529.26,402.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="-8" y="398" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="0" y="410.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">6</text></g></g><g class="pele-edge pele-message" data-id="i9"><path d="M733.33,443H544.26"/><path class="pele-marker" d="M537.26,443L545.26,439.64L545.26,446.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="733.33" y="435" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="741.33" y="447.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">7</text></g></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i1"><text x="143.36" y="77.4" text-anchor="middle">open connection</text></g><g class="pele-edge-label" data-id="i3"><text x="411.98" y="190.4" text-anchor="middle">create room, or eject the stale tab</text></g><g class="pele-edge-label" data-id="i4"><text x="403.98" y="227.4" text-anchor="middle">room URL + meeting tokens</text></g><g class="pele-edge-label" data-id="i5"><rect x="369.96" y="251" width="288.11" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="514.02" y="264.4" text-anchor="middle">queue the voice agent Job + start the session</text></g><g class="pele-edge-label" data-id="i7"><text x="135.36" y="359.4" text-anchor="middle">room URL + meeting token</text></g><g class="pele-edge-label" data-id="i8"><rect x="156.45" y="383" width="232.37" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="272.63" y="396.4" text-anchor="middle">join · WebRTC audio + RTVI events</text></g><g class="pele-edge-label" data-id="i9"><text x="635.29" y="433.4" text-anchor="middle">join with the owner token</text></g></g><g class="pele-notes" font-size="14" fill="var(--_a)" stroke="var(--_b)"><g class="pele-note" data-id="i2"><rect x="117.74" y="97" width="321.94" height="66" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" text-anchor="middle" xml:space="preserve"><tspan x="278.71" y="116.9">Authorize the originating user.</tspan><tspan x="278.71" y="134.9">Rejoin the running call, or replace an ended one.</tspan><tspan x="278.71" y="152.9">Provider keys stay server-side.</tspan></text></g><g class="pele-note" data-id="i6"><rect x="613.84" y="284" width="254.98" height="48" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" text-anchor="middle" xml:space="preserve"><tspan x="741.33" y="303.9">Claims the interview.voice_agent Job.</tspan><tspan x="741.33" y="321.9">Flux · Sol Ultrafast · ElevenLabs</tspan></tex