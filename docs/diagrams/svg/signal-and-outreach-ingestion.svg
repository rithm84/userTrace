<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1252 669" width="1252" height="669" style="max-width:100%;height:auto" role="img" aria-label="Discord ingestion · deduplicate, debounce, seal, route"><title>Discord ingestion · deduplicate, debounce, seal, route</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1252" height="669" rx="8"/><svg x="0" y="0" class="pele pele-sequence" viewBox="0 0 1252 669" width="1252" height="669" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="sequence"><g transform="translate(67.11,24)"><g class="pele-lifelines" fill="none" stroke="var(--_b)"><path class="pele-lifeline" data-id="discord" d="M0,44V577"/><path class="pele-lifeline" data-id="conn" d="M318.03,44V577"/><path class="pele-lifeline" data-id="intake" d="M696.3,44V577"/><path class="pele-lifeline" data-id="router" d="M1096.08,44V577"/></g><g class="pele-frames" font-size="14" stroke="var(--_b)"><g class="pele-frame pele-frame-alt"><rect x="-20" y="62" width="477.36" height="228" fill="none" style="rx:var(--_r)"/><path d="M-20,177H457.36" stroke-dasharray="4 4"/><rect x="-15" y="181" width="253.44" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="111.72" y="194.4" text-anchor="middle">[staff re-ingestion of a missed message]</text><rect x="-20" y="62" width="28" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="-6" y="76.2" text-anchor="middle" font-size="12" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">alt</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="58.41" y="77.4" text-anchor="middle">[live gateway]</text></g><g class="pele-frame pele-frame-loop"><rect x="-20" y="375" width="736.3" height="109" fill="none" style="rx:var(--_r)"/><rect x="-20" y="375" width="39.33" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="-0.33" y="389.2" text-anchor="middle" font-size="12" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">loop</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="122.27" y="390.4" text-anchor="middle">[until the quiet window passes]</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i2"><path d="M8,122H311.03"/><path class="pele-marker" d="M318.03,122L310.03,125.36L310.03,118.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="-8" y="114" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="0" y="126.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">1</text></g></g><g class="pele-edge pele-message" data-id="i6"><path d="M310.03,278H7"/><path class="pele-marker" d="M0,278L8,274.64L8,281.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="310.03" y="270" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="318.03" y="282.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">2</text></g></g><g class="pele-edge pele-message" data-id="i8"><path d="M326.03,327H689.3"/><path class="pele-marker" d="M696.3,327L688.3,330.36L688.3,323.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="310.03" y="319" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="318.03" y="331.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">3</text></g></g><g class="pele-edge pele-message" data-id="i9"><path d="M704.3,341H726.3A6,6 0 0 1 732.3,347V357A6,6 0 0 1 726.3,363H703.3"/><path class="pele-marker" d="M696.3,363L704.3,359.64L704.3,366.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="688.3" y="333" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="696.3" y="345.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">4</text></g></g><g class="pele-edge pele-message" data-id="i11"><path d="M8,435H311.03"/><path class="pele-marker" d="M318.03,435L310.03,438.36L310.03,431.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="-8" y="427" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="0" y="439.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">5</text></g></g><g class="pele-edge pele-message" data-id="i12"><path d="M326.03,472H689.3"/><path class="pele-marker" d="M696.3,472L688.3,475.36L688.3,468.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="310.03" y="464" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="318.03" y="476.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">6</text></g></g><g class="pele-edge pele-message" data-id="i14"><path d="M704.3,498H726.3A6,6 0 0 1 732.3,504V514A6,6 0 0 1 726.3,520H703.3"/><path class="pele-marker" d="M696.3,520L704.3,516.64L704.3,523.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="688.3" y="490" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="696.3" y="502.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">7</text></g></g><g class="pele-edge pele-message" data-id="i15"><path d="M704.3,557H1089.08"/><path class="pele-marker" d="M1096.08,557L1088.08,560.36L1088.08,553.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="688.3" y="549" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="696.3" y="561.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">8</text></g></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i2"><text x="163.01" y="112.4" text-anchor="middle">message in a watched cha