<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1139 796" width="1139" height="796" style="max-width:100%;height:auto" role="img" aria-label="Shared contracts · facts, authority, and outcomes"><title>Shared contracts · facts, authority, and outcomes</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1139" height="796" rx="8"/><svg x="0" y="0" class="pele pele-sequence" viewBox="0 0 1139 796" width="1139" height="796" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="sequence"><g transform="translate(136.68,24)"><g class="pele-lifelines" fill="none" stroke="var(--_b)"><path class="pele-lifeline" data-id="producer" d="M0,44V704"/><path class="pele-lifeline" data-id="cp" d="M286.89,44V704"/><path class="pele-lifeline" data-id="target" d="M694.38,44V704"/><path class="pele-lifeline" data-id="model" d="M863.3,44V704"/></g><g class="pele-frames" font-size="14" stroke="var(--_b)"><g class="pele-frame pele-frame-par"><rect x="250.89" y="157" width="726.45" height="317" fill="none" style="rx:var(--_r)"/><path d="M250.89,324H977.35" stroke-dasharray="4 4"/><rect x="255.89" y="328" width="67.49" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="289.64" y="341.4" text-anchor="middle">[Job path]</text><rect x="250.89" y="157" width="32.67" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="267.23" y="171.2" text-anchor="middle" font-size="12" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">par</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="343.31" y="172.4" text-anchor="middle">[Command path]</text></g><g class="pele-frame pele-frame-alt"><rect x="266.89" y="544" width="340.42" height="140" fill="none" style="rx:var(--_r)"/><path d="M266.89,615H607.31" stroke-dasharray="4 4"/><rect x="271.89" y="619" width="86.15" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="314.97" y="632.4" text-anchor="middle">[stale or late]</text><rect x="266.89" y="544" width="28" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="280.9" y="558.2" text-anchor="middle" font-size="12" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">alt</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="370.19" y="559.4" text-anchor="middle">[revisions still current]</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i1"><path d="M8,87H279.89"/><path class="pele-marker" d="M286.89,87L278.89,90.36L278.89,83.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="-8" y="79" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="0" y="91.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">1</text></g></g><g class="pele-edge pele-message" data-id="i5"><path d="M294.89,275H687.38"/><path class="pele-marker" d="M694.38,275L686.38,278.36L686.38,271.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="278.89" y="267" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="286.89" y="279.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">2</text></g></g><g class="pele-edge pele-message" data-id="i6"><path d="M686.38,312H293.89" stroke-dasharray="4 4"/><path class="pele-marker" d="M286.89,312L294.89,308.64L294.89,315.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="686.38" y="304" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="694.38" y="316.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">3</text></g></g><g class="pele-edge pele-message" data-id="i8"><path d="M294.89,382H856.3"/><path class="pele-marker" d="M863.3,382L855.3,385.36L855.3,378.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="278.89" y="374" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="286.89" y="386.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">4</text></g></g><g class="pele-edge pele-message" data-id="i10"><path d="M855.3,462H293.89" stroke-dasharray="4 4"/><path class="pele-marker" d="M286.89,462L294.89,458.64L294.89,465.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="855.3" y="454" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="863.3" y="466.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">5</text></g></g><g class="pele-edge pele-message" data-id="i14"><path d="M294.89,581H316.89A6,6 0 0 1 322.89,587V597A6,6 0 0 1 316.89,603H293.89"/><path class="pele-marker" d="M286.89,603L294.89,599.64L294.89,606.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="278.89" y="573" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="286.89" y="585.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">6</text></g></g><g class="pele-edge pele-message" data-id="i16"><path d="M294.89,650H316.89A6,6 0 0 1 322.89,656V666A6,6 0 0 1 316.89,672H293.89"/><path class="pele-marker" d="M286.89,672L294.89,668.64L294.89,675.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="278.89" y="642" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="286.89" y="654.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">7</text></g></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i1"><text x="147.45" y="77.4" text-anchor="middle">Event · source + occurrence + receipt</text></g><g class="pele-edge-label" data-id="i5"><text x="494.64" y="265.4" text-anchor="middle">Command · scope + deadline + revision</text></g><g class="pele-edge-label" data-id="i6"><text x="486.64" y="302.4" text-anchor="middle">Result · execution outcome: accepted, progress, terminal</text></g><g class="pele-edge-label" data-id="i8"><rect x="444.62" y="359" width="268.96" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="579.1" y="372.4" text-anchor="middle">Job · analyze, as durable work + attempts</text></g><g class="pele-edge-label" data-id="i10"><rect x="431.75" y="439" width="278.69" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="571.1" y="452.4" text-anchor="middle">Model proposal · bundle + model + sources</text></g><g class="pele-edge-label" data-id="i14"><text x="427.38" y="596.9" text-anchor="middle">commit the next legal transition</text></g><g class="pele-edge-label" data-id="i16"><text x="450.1" y="665.9" text-anchor="middle">reject · late results cannot revive work</text></g></g><g class="pele-notes" font-size="14" fill="var(--_a)" stroke="var(--_b)"><g class="pele-note" data-id="i2"><rect x="137.61" y="97" width="298.57" height="48" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" text-anchor="middle" xml:space="preserve"><tspan x="286.89" y="116.9">A recorded fact. Deduplicate by message_id,</tspan><tspan x="286.89" y="134.9">then sequence it in its lifecycle stream.</tspan></text></g><g class="pele-note" data-id="i4"><rect x="270.89" y="190" width="439.49" height="48" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" text-anchor="middle" xml:space="preserve"><tspan x="490.64" y="209.9">A legal transition authorizes one operation.</tspan><tspan x="490.64" y="227.9">command_id is the idempotency boundary.</tspan></text></g><g class="pele-note" data-id="i9"><rect x="769.26" y="392" width="188.08" height="33" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" x="863.3" y="413.4" text-anchor="middle">Lease and retry checkpoint</text></g><g class="pele-note" data-id="i12"><rect x="65.44" y="484" width="442.9" height="48" style="rx:var(--_r)"/><text class="pele-label" stroke="none" fill="var(--_fg)" text-anchor="middle" xml:space="preserve"><tspan x="286.89" y="503.9">Freshness check: reconcile each Result and validate</tspan><tspan x="286.89" y="521.9">each proposal's dependencies against current context and authority.</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="producer"><rect x="-112.68" y="704" width="225.36" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="731.6" text-anchor="middle">Producer · adapter or SDK</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="cp"><rect x="223.32" y="704" width="127.15" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="286.89" y="731.6" text-anchor="middle">Control plane</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="target"><rect x="618.81" y="704" width="151.15" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="694.38" y="731.6" text-anchor="middle">Command target</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="model"><rect x="809.96" y="704" width="106.69" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="863.3" y="731.6" text-anchor="middle">Model role</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="producer"><rect x="-112.68" y="0" width="225.36" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="27.6" text-anchor="middle">Producer · adapter or SDK</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="cp"><rect x="223.32" y="0" width="127.15" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="286.89" y="27.6" text-anchor="middle">Control plane</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="target"><rect x="618.81" y="0" width="151.15" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="694.38" y="27.6" text-anchor="middle">Command target</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="model"><rect x="809.96" y="0" width="106.69" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="863.3" y="27.6" text-anchor="middle">Model role</text></g></g></g></svg></svg>
