4" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="473.86" y="844.6" text-anchor="middle">Browser ingestion</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="cp"><rect x="593.44" y="817" width="127.15" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="657.01" y="844.6" text-anchor="middle">Control plane</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="rt"><rect x="-96.47" y="0" width="192.94" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="27.6" text-anchor="middle">Top-document runtime</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="ing"><rect x="394.28" y="0" width="159.15" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="473.86" y="27.6" text-anchor="middle">Browser ingestion</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="cp"><rect x="593.44" y="0" width="127.15" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="657.01" y="27.6" text-anchor="middle">Control plane</text></g></g></g></svg></svg>
