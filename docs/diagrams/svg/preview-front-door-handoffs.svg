)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="722.6" text-anchor="middle">Session tab</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="page"><rect x="115.14" y="695" width="115.58" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="172.93" y="722.6" text-anchor="middle">Preview tab</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="door"><rect x="426.21" y="695" width="150.27" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="501.35" y="722.6" text-anchor="middle">Vercel front door</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="cp"><rect x="779.56" y="695" width="127.15" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="843.14" y="722.6" text-anchor="middle">Control plane</text></g><g class="pele-node pele-actor pele-actor-participant pele-actor-footer" data-id="app"><rect x="946.71" y="695" width="130.7" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="1012.06" y="722.6" text-anchor="middle">Client product</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="tab"><rect x="-57.8" y="0" width="115.6" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="27.6" text-anchor="middle">Session tab</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="page"><rect x="115.14" y="0" width="115.58" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="172.93" y="27.6" text-anchor="middle">Preview tab</text></g><g class="pele-node pele-actor pele-actor-participant" data-id="door"><rect x="426.21" y="0" width="150.27" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="501.3