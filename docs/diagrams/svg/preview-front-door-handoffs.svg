ce-number"><rect x="1001.39" y="630" width="21.34" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="1012.06" y="642.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">12</text></g></g><g class="pele-edge pele-message" data-id="i16"><path d="M490.68,675H179.93" stroke-dasharray="4 4"/><path class="pele-marker" d="M172.93,675L180.93,671.64L180.93,678.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="490.68" y="667" width="21.34" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="501.35" y="679.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">13</text></g></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i2"><rect x="271.61" y="107" width="307.91" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="425.57" y="120.4" text-anchor="middle">POST /v1/sessions/{session_id}/preview-handoff</text></g><g class="pele-edge-label" data-id="i4"><rect x="316.15" y="202" width="202.84" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="417.57" y="215.4" text-anchor="middle">claim URL on the session origin</text></g><g class="pele-edge-label" data-id="i5"><text x="90.47" y="252.4" text-anchor="middle">open the claim URL</text></g><g class="pele-edge-label" data-id="i6"><text x="341.14" y="289.4" text-anchor="middle">claim URL · one-time code</text></g><g class="pele-edge-label" data-id="i7"><text x="676.24" y="326.4" text-anchor="middle">POST /v1/preview/handoffs/{code}/exchange</text></g><g class="pele-edge-label" data-id="i8"><text x="668.24" y="363.4" text-anchor="middle">origin-bound session credential</text></g><g class="pele-edge-label" data-id="i9"><text x="333.14" y="400.4" text-anchor="middle">session cookie · redirect to /__utrace/sign-in</text></g><g class="pele-edge-label" data-id="i11"><text x="341.14" y="480.4" text-anchor="middle">GET /__utrace/sign-in</text></g><g class="pele-edge-label" data-id="i12"><text x="676.24" y="517.