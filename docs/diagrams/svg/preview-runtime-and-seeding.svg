<g class="pele-edge-label" data-id="L_pool_base_0"><rect x="461.22" y="453.5" width="40.66" height="21" rx="3" fill="var(--_bg)"/><text x="481.55" y="468.9" text-anchor="middle">claim</text></g><g class="pele-edge-label" data-id="L_release_template_0"><rect x="310.39" y="104.5" width="33.68" height="21" rx="3" fill="var(--_bg)"/><text x="327.22" y="119.9" text-anchor="middle">pins</text></g><g class="pele-edge-label" data-id="L_release_seed_0"><rect x="680.78" y="104.5" width="93.6" height="21" rx="3" fill="var(--_bg)"/><text x="727.58" y="119.9" text-anchor="middle">pins by digest</text></g><g class="pele-edge-label" data-id="L_snapshot_sandbox_0"><rect x="438.95" y="349.5" width="130.93" height="21" rx="3" fill="var(--_bg)"/><text x="504.41" y="364.9" text-anchor="middle">boots every runtime</text></g><g class="pele-edge-label" data-id="L_seed_sandbox_0"><rect x="615.63" y="349.5" width="223.91" height="21" rx="3" fill="var(--_bg)"/><text x="727.58" y="364.9" text-anchor="middle">installed + verified in every runtime</text></g><g class="pele-edge-label" data-id="L_probes_route_0"><rect x="725.95" y="626.5" width="55.46" height="21" rx="3" fill="var(--_bg)"/><text x="753.68" y="641.9" text-anchor="middle">all pass</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-doc runtime" data-id="release" transform="translate(527.4,53)"><path d="M-114.93,-29H114.93V19q-57.46,-12 -114.93,0t-114.93,0Z" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="0.6" text-anchor="middle">Client configuration release</text></g><g class="pele-node pele-shape-cyl runtime" data-id="image" transform="translate(133.57,251)"><path d="M-69.57,-24A69.57,9.94 0 0 1 69.57,-24V24A69.57,9.94 0 0 1 -69.57,24Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-69.57,-24A69.57,9.94 0 0 0 69.57,-24" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="10.57" text-anchor="middle">Custom image</text></g><g class="pele-node pele-shape-cyl runtime" data-id="snap