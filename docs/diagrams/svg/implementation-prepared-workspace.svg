<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 478 755" width="478" height="755" style="max-width:100%;height:auto" role="img" aria-label="Prepared workspace · built during the interview, claimed by an approved attempt"><title>Prepared workspace · built during the interview, claimed by an approved attempt</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="478" height="755" rx="8"/><svg x="0" y="0" class="pele pele-state" viewBox="0 0 478 755" width="478" height="755" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M240.48,38L240.48,100"/><path class="pele-marker" d="M240.48,107L237.12,99L243.84,99Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M240.48,249L240.48,311"/><path class="pele-marker" d="M240.48,318L237.12,310L243.84,310Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M192.43,418C192.43,427.25 129.21,427.25 129.21,436.5L129.21,495"/><path class="pele-marker" d="M129.21,502L125.85,494L132.57,494Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M288.52,418C288.52,427.25 351.74,427.25 351.74,436.5L351.74,526.5"/><path class="pele-marker" d="M351.74,533.5L348.38,525.5L355.1,525.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M129.21,644L129.21,687.5C129.21,694.42 240.48,694.45 240.48,701.38L240.48,706"/><path class="pele-marker" d="M240.48,713L237.12,705L243.84,705Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M351.74,612.5C351.74,656.25 240.48,656.25 240.48,700L240.48,706"/><path class="pele-marker" d="M240.48,713L237.12,705L243.84,705Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge0"><rect x="141.16" y="58.5" width="198.62" height="21" rx="3" fill="var(--_bg)"/><text x="240.48" y="73.9" text-anchor="middle">participant claims the invitation</text></g><g class="pele-edge-label" data-id="edge1"><rect x="180.84" y="269.5" width="119.27" height="21" rx="3" fill="var(--_bg)"/><text x="240.48" y="284.9" text-anchor="middle">baseline recorded</text></g><g class="pele-edge-label" data-id="edge2"><rect x="26" y="438.5" width="206.42" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="129.21" y="452.4">approved attempt with matching</tspan><tspan x="129.21" y="470.4">pins</tspan></text></g><g class="pele-edge-label" data-id="edge3"><rect x="252.42" y="438.5" width="198.64" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="351.74" y="452.4">case ends or one-hour window</tspan><tspan x="351.74" y="470.4">passes</tspan></text></g><g class="pele-edge-label" data-id="edge4"><rect x="52.08" y="664.5" width="154.27" height="21" rx="3" fill="var(--_bg)"/><text x="129.21" y="679.9" text-anchor="middle">first cycle starts at once</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(240.48,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state async" data-id="preparing" transform="translate(240.48,178)"><rect x="-111.33" y="-71" width="222.65" height="142" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-111.33,-31H111.33" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-43.4" text-anchor="middle">Preparing</text><text class="pele-state-description" font-size="14" x="0" y="-7.6" text-anchor="middle">Sandbox from pinned template</text><text class="pele-state-description" font-size="14" x="0" y="13.4" text-anchor="middle">Base revision checked out</text><text class="pele-state-description" font-size="14" x="0" y="34.4" text-anchor="middle">Client recipe's dependencies</text><text class="pele-state-description" font-size="14" x="0" y="55.4" text-anchor="middle">Checks run on the clean base</text></g><g class="pele-node pele-state async" data-id="prepared" transform="translate(240.48,368)"><rect x="-100.04" y="-50" width="200.08" height="100" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-100.04,-10H100.04" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-22.4" text-anchor="middle">Prepared</text><text class="pele-state-description" font-size="14" x="0" y="13.4" text-anchor="middle">No lease, data, or authority</text><text class="pele-state-description" font-size="14" x="0" y="34.4" text-anchor="middle">Package registry only</text></g><g class="pele-node pele-state runtime" data-id="claimed" transform="translate(129.21,573)"><rect x="-104.33" y="-71" width="208.67" height="142" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-104.33,-31H104.33" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-43.4" text-anchor="middle">Claimed</text><text class="pele-state-description" font-size="14" x="0" y="-7.6" text-anchor="middle">Bound to the attempt</text><text class="pele-state-description" font-size="14" x="0" y="13.4" text-anchor="middle">and its fencing token</text><text class="pele-state-description" font-size="14" x="0" y="34.4" text-anchor="middle">Egress opened to the model</text><text class="pele-state-description" font-size="14" x="0" y="55.4" text-anchor="middle">Limit extended to the budget</text></g><g class="pele-node pele-state neutral" data-id="released" transform="translate(351.74,573)"><rect x="-76.31" y="-39.5" width="152.62" height="79" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-76.31,0.5H76.31" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-11.9" text-anchor="middle">Released</text>