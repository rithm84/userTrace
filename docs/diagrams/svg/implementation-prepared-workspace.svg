 x="801.35" y="913.4">the attempt ends without</tspan><tspan x="801.35" y="931.4">handing it over</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(908.34,31)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state async" data-id="preparing" transform="translate(908.34,185.5)"><rect x="-111.33" y="-78.5" width="222.65" height="157" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-111.33,-38.5H111.33" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-50.9" text-anchor="middle">Preparing</text><text class="pele-state-description" font-size="14" x="0" y="-15.1" text-anchor="middle">Sandbox from pinned template</text><text class="pele-state-description" font-size="14" x="0" y="5.9" text-anchor="middle">Base revision checked out</text><text class="pele-state-description" font-size="14" x="0" y="26.9" text-anchor="middle">Client recipe's dependencies</text><text class="pele-state-description" font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="0" y="46.4">Type check warmed in the</tspan><tspan x="0" y="64.4">checkout</tspan></text></g><g class="pele-node pele-state async" data-id="prepared" transform="translate(908.34,401)"><rect x="-104.87" y="-68" width="209.74" height="136" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-104.87,-28H104.87" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-40.4" text-anchor="middle">Prepared</text><text class="pele-state-description" font-size="14" x="0" y="-4.6" text-anchor="middle">No lease, data, or authority</text><text class="pele-state-description" font-size="14" x="0" y="16.4" text-anchor="middle">The base, or a version's files</text><text class="pele-state-description" font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="0" y="35.9">Baseline recorded, or still</tspan><tspan x="0" y="53.9">running</tspan></text></g><g class="pele-node pele-state async" data-id="drafting" transform="translate(352.29,613.5)"><rect x="-111.33" y="-60.5" width="222.67" height="121" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-111.33,-20.5H111.33" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-32.9" text-anchor="middle">Drafting</text><text class="pele-state-description" font-size="14" x="0" y="2.9" text-anchor="middle">The request, then the proposal</text><text class="pele-state-description" font-size="14" x="0" y="23.9" text-anchor="middle">Egress opened to the model</text><text class="pele-state-description" font-size="14" x="0" y="44.9" text-anchor="middle">Still no lease or authority</text></g><g class="pele-node pele-state runtime" data-id="claimed" transform="translate(801.35,818.5)"><rect x="-104.33" y="-60.5" width="208.67" height="121" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-104.33,-20.5H104.33" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-32.9" text-anchor="middle">Claimed</text><text class="pele-state-description" font-size="14" x="0" y="2.9" text-anchor="middle">Bound to the attempt</text><text class="pele-state-description" font-size="14" x="0" y="23.9" text-anchor="middle">and its fencing token</text><text class="pele-state-description" font-size="14" x="0" y="44.9" text-anchor="middle">Limit extended to the budget</text></g><g class="pele-node pele-state neutral" data-id="released" transform="translate(801.35,1002.5)"><rect x="-76.31" y="-39.5" width="152.62" height="79" rx="10" fill="var(--_s)" stroke="var(--_b)"/><path d="M-76.31,0.5H76.31" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="-11.9" text-anchor="middle">Released</text><text class="pele-state-description" font-size="14" x="0" y="23.9" text-anchor="middle">Sandbox destroyed</text></g><g class="pele-node pele-state-end" data-id="root_end" transform="translate(801.35,1095)"><circle r="8.5" fill="var(--_bg)" stroke="var(--_l)"/><circle r="5" fill="var(--_l)"/></g></g></svg></svg>
