<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 961 604" width="961" height="604" style="max-width:100%;height:auto" role="img" aria-label="Data ownership · one authoritative record per fact"><title>Data ownership · one authoritative record per fact</title><style><![CDATA[
/*
  Shared uTrace diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::runtime`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #24303a;
  --pele-muted: #5c6770;
  --pele-line: #596773;
  --pele-surface: #f2f4f6;
  --pele-surface-alt: #f7f8fa;
  --pele-border: #5c6770;
  --pele-accent: #1971c2;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;      --people-stroke: #1971c2;
  --runtime-fill: #eee8ff;     --runtime-stroke: #7048e8;
  --reasoning-fill: #f8e7fc;   --reasoning-stroke: #9c36b5;
  --observation-fill: #e3fafc; --observation-stroke: #0c8599;
  --external-fill: #fff0ed;    --external-stroke: #c44d41;
  --outcome-fill: #e5f5e8;     --outcome-stroke: #2f9e44;
  --async-fill: #ffd8a8;       --async-stroke: #e8590c;
  --gate-fill: #fff4d6;        --gate-stroke: #b37c00;
  --neutral-fill: #f2f4f6;     --neutral-stroke: #5c6770;
  --client-fill: #ffffff;      --client-stroke: #1e1e1e;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #0d1117;
    --pele-fg: #e6edf3;
    --pele-muted: #9da7b3;
    --pele-line: #9da7b3;
    --pele-surface: #161b22;
    --pele-surface-alt: #10151c;
    --pele-border: #6e7781;
    --pele-accent: #4dabf7;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;      --people-stroke: #4dabf7;
    --runtime-fill: #241c49;     --runtime-stroke: #9775fa;
    --reasoning-fill: #381640;   --reasoning-stroke: #da77f2;
    --observation-fill: #0b3338; --observation-stroke: #3bc9db;
    --external-fill: #3d1714;    --external-stroke: #ff8787;
    --outcome-fill: #11321b;     --outcome-stroke: #51cf66;
    --async-fill: #4a2508;       --async-stroke: #ff922b;
    --gate-fill: #3d2e05;        --gate-stroke: #fcc419;
    --neutral-fill: #21262d;     --neutral-stroke: #8b949e;
    --client-fill: #161b22;      --client-stroke: #c9d1d9;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.runtime > :is(rect, path, polygon, circle, ellipse),
.pele-node.runtime > g > path { fill: var(--runtime-fill); stroke: var(--runtime-stroke); }
.pele-node.reasoning > :is(rect, path, polygon, circle, ellipse),
.pele-node.reasoning > g > path { fill: var(--reasoning-fill); stroke: var(--reasoning-stroke); }
.pele-node.observation > :is(rect, path, polygon, circle, ellipse),
.pele-node.observation > g > path { fill: var(--observation-fill); stroke: var(--observation-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.outcome > :is(rect, path, polygon, circle, ellipse),
.pele-node.outcome > g > path { fill: var(--outcome-fill); stroke: var(--outcome-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }
.pele-node.client > :is(rect, path, polygon, circle, ellipse),
.pele-node.client > g > path { fill: var(--client-fill); stroke: var(--client-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. Its
   opaque surface fill keeps the region visible on the dark background. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="961" height="604" rx="8"/><svg x="0" y="0" class="pele pele-flowchart" viewBox="0 0 961 604" width="961" height="604" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_w:var(--pele-bold-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="pele-clusters"><g class="pele-cluster" data-id="supabase"><rect x="24" y="184" width="912.69" height="396" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="100.26" y="209.6" text-anchor="middle">Supabase project</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_cp_pg_0"><path d="M457.68,111L457.68,237"/><path class="pele-marker" d="M457.68,244L454.32,236L461.04,236Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pg_storage_0"><path d="M424.05,375.54C424.05,382.29 163.82,389.75 163.82,396.5L163.82,442"/><path class="pele-marker" d="M163.82,449L160.46,441L167.18,441Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pg_queues_0"><path d="M457.68,376L457.68,442"/><path class="pele-marker" d="M457.68,449L454.32,441L461.04,441Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pg_realtime_0"><path d="M491.31,375.54C491.31,381.75 774.21,390.29 774.21,396.5L774.21,442"/><path class="pele-marker" d="M774.21,449L770.85,441L777.57,441Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_cp_pg_0"><rect x="431.13" y="133.5" width="53.11" height="21" rx="3" fill="var(--_bg)"/><text x="457.68" y="148.9" text-anchor="middle">commit</text></g><g class="pele-edge-label" data-id="L_pg_storage_0"><rect x="126.75" y="398.5" width="74.14" height="21" rx="3" fill="var(--_bg)"/><text x="163.82" y="413.9" text-anchor="middle">references</text></g><g class="pele-edge-label" data-id="L_pg_queues_0"><rect x="427.61" y="398.5" width="60.14" height="21" rx="3" fill="var(--_bg)"/><text x="457.68" y="413.9" text-anchor="middle">dispatch</text></g><g class="pele-edge-label" data-id="L_pg_realtime_0"><rect x="753.48" y="398.5" width="41.46" height="21" rx="3" fill="var(--_bg)"/><text x="774.21" y="413.9" text-anchor="middle">notify</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect runtime" data-id="cp" transform="translate(457.68,67.5)"><rect x="-109.6" y="-43.5" width="219.2" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Control plane</tspan><tspan x="0" y="5.6">Validated state transitions</tspan><tspan x="0" y="26.6">Atomic event + outbox</tspan></text></g><g class="pele-node pele-shape-cyl outcome" data-id="pg" transform="translate(457.68,310)"><path d="M-122.71,-54A122.71,12 0 0 1 122.71,-54V54A122.71,12 0 0 1 -122.71,54Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-122.71,-54A122.71,12 0 0 0 122.71,-54" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-19.9" font-weight="var(--_w)">Supabase Postgres</tspan><tspan x="0" y="1.1">Identity · lifecycle · evidence</tspan><tspan x="0" y="22.1">Reports · jobs</tspan><tspan x="0" y="43.1">Offer ledger + credit issuance</tspan></text></g><g class="pele-node pele-shape-cyl outcome" data-id="storage" transform="translate(163.82,504.5)"><path d="M-119.82,-43.5A119.82,12 0 0 1 119.82,-43.5V43.5A119.82,12 0 0 1 -119.82,43.5Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-119.82,-43.5A119.82,12 0 0 0 119.82,-43.5" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-9.4" font-weight="var(--_w)">Supabase Storage</tspan><tspan x="0" y="11.6">Immutable scoped artifacts</tspan><tspan x="0" y="32.6">Hash / type / size verification</tspan></text></g><g class="pele-node pele-shape-h-cyl runtime" data-id="queues" transform="translate(457.68,492.5)"><path d="M-122.05,-43.5H122.05A12,43.5 0 0 1 122.05,43.5H-122.05A12,43.5 0 0 1 -122.05,-43.5Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M122.05,-43.5A12,43.5 0 0 0 122.05,43.5" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Queues + Cron</tspan><tspan x="0" y="5.6">Outbox wake-ups</tspan><tspan x="0" y="26.6">Scheduling and reconciliation</tspan></text></g><g class="pele-node pele-shape-h-cyl people" data-id="realtime" transform="translate(774.21,492.5)"><path d="M-130.48,-43.5H130.48A12,43.5 0 0 1 130.48,43.5H-130.48A12,43.5 0 0 1 -130.48,-43.5Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M130.48,-43.5A12,43.5 0 0 0 130.48,43.5" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4" font-weight="var(--_w)">Supabase Realtime</tspan><tspan x="0" y="5.6">RLS-filtered session projections</tspan><tspan x="0" y="26.6">Committed updates only</tspan></text></g></g></svg></svg>
