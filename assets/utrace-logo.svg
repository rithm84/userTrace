  <!--
    Deterministic uTrace mark (magnifying glass with eyes), variant B.
    Single even-odd path; the outer lens and handle are one continuous contour.
    Construction:
      - Lens ring: outer ellipse rx 406 ry 418 at (436.9, 442.9) - 3% taller
        than wide, echoing the original mark; inner ellipse = radii - 72
        (constant ring thickness 72).
      - Eyes: superellipses (four cubic quadrants, kappa 0.60 vs 0.5523 for a
        true ellipse - fuller shoulders), a 99 b 168, centered 124px either
        side of the lens center and 9px below it.
      - Handle: 45deg axis through the lens center. Neck edges leave the outer
        ellipse tangentially at parametric angles 45 -/+ 25deg (tangent length
        175) and meet the end blob (circle r 98, center 648px out along the
        axis) tangentially at +/-110deg (tangent length 76); the outer contour
        continues around the remaining lens ellipse. Neck waist ~127px.
      - Ink bbox centered: margins 30.9 left/right, 24.9 top/bottom.
    Generator: parameters above fully determine every coordinate.
  -->
