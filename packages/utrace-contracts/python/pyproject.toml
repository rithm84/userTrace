[project]
name = "utrace-contracts"
version = "0.1.0"
description = "Versioned uTrace contracts: pydantic bindings and validators over the shared JSON Schemas."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.12.3",
  "jsonschema[format-nongpl]>=4.25.1",
  "referencing>=0.37.0",
  "rfc8785>=0.1.4",
  "uuid6>=2025.0.1; python_version < '3.14'",
]

[project.scripts]
utrace-schema-lint = "utrace_contracts.schema_lint:main"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "ruff>=0.14.1",
  "mypy>=1.18.2",
  "types-jsonschema>=4.25",
  "uuid6>=2025.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utrace_contracts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "TID", "ARG", "PTH", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src/utrace_contracts", "tests", "scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
